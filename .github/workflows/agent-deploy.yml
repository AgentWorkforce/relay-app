# Deploys layered-relay-app (agent/) through layered-agents' composite
# deploy action (the composite form of its reusable deploy workflow: this
# repository is public, and GitHub refuses a public repository's call to a
# private repository's reusable workflow). Bootstrap-only changes (prompt,
# lane scripts) hot-update the running host over SSM, so the lead keeps its
# context. Any other template change stops/starts or replaces the instance,
# and runs only from a manual dispatch with allow_restart.
#
# Before every deploy, allow_restart dispatches included, the preview job
# creates a non-executing CloudFormation change set on the compute stack from
# the AMI pin template (AmiId pinned plus AgentHost's LayeredAgentAmiPin
# metadata marker) and fails closed: a permission error, a failed cleanup,
# a removal, an AmiId other than the template's pinned default, a change set
# with no changes or no in-place AgentHost change (the pin would not
# persist), or a replacement of AgentHost or any resource stops the run before
# the deploy action starts. The one policy difference: a dispatch with
# allow_restart (a human's decision that the host may be replaced) lists a
# replacement in the step summary as "replacement allowed by allow_restart"
# instead of failing; everything else is checked the same. Once the deployed
# template carries the pin and the marker there is nothing to preview and it
# passes.
name: Agent Deploy

# A landing on main that changes agent/ or its workflows deploys it once
# Agent CI has passed on that commit (a bootstrap-only change hot-updates the
# host; anything else waits for a manual dispatch with allow_restart).
on:
  workflow_run:
    workflows: [Agent CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_restart:
        description: Allow a deploy that stops/starts or replaces the host
        type: boolean
        default: false

jobs:
  # Decides whether an automatic run deploys: only when the landing changed
  # what the deploy reads since the last successful deploy, as recorded by
  # the record job's agent-deployed artifact. A dispatch always deploys. The
  # path list mirrors AGENT_CI_PREFIXES in flows/lib/remote-ci.mjs; keep the
  # two in sync by hand (a workflow cannot import it).
  changed:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Check out the CI run's commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare with the last successful deploy
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != workflow_run ]; then
            echo "$EVENT: deploying without a path check"
            echo deploy=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The baseline is the head of the run that uploaded the newest
          # agent-deployed artifact, which the record job leaves after each
          # successful deploy (a dispatch with allow_restart that deployed
          # leaves one too, so its head becomes the baseline). Every page is
          # read (--paginate, filtered per page by --jq); artifacts
          # are not listed newest first, so the newest unexpired one by
          # created_at (ISO 8601, so it sorts as text) is the baseline. The
          # set stays bounded, one artifact per deploy. An artifact expires
          # after 90 days, after which the run deploys anyway, which the kit
          # makes a no-op. A failed gh api call fails the step (pipefail).
          last=$(gh api --paginate "repos/$REPO/actions/artifacts?name=agent-deployed&per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | "\(.created_at) \(.workflow_run.head_sha)"' \
            | sort | tail -1 | cut -d' ' -f2)
          paths=(agent/ .github/workflows/agent-ci.yml .github/workflows/agent-deploy.yml)
          if [ -z "$last" ]; then
            echo "No record of a deploy (no agent-deployed artifact, or it expired): deploying $HEAD_SHA"
            deploy=true
          elif ! git cat-file -e "$last^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$last" "$HEAD_SHA"; then
            echo "Last deployed $last is not an ancestor of $HEAD_SHA: deploying"
            deploy=true
          elif [ -n "$(git diff --name-only "$last" "$HEAD_SHA" -- "${paths[@]}")" ]; then
            echo "Changed since last deployed $last under ${paths[*]}:"
            git diff --name-only "$last" "$HEAD_SHA" -- "${paths[@]}"
            deploy=true
          else
            echo "Nothing under ${paths[*]} changed between last deployed $last and $HEAD_SHA: not deploying"
            deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  # A non-executing CloudFormation change set on the compute stack, before
  # every deploy, from the template the AMI pin adoption would deploy (the
  # deployed one with AmiId switched to the pin and the LayeredAgentAmiPin
  # marker added to AgentHost's Metadata, as kit 0.1.15 builds it;
  # agent/preview-change-set.sh). It fails unless AgentHost is modified in
  # place (the marker; an empty "no changes" change set fails, since the pin
  # would not persist) and AmiId takes the template's pinned default (Alchemy
  # does not pass AmiId); a permission error fails it too, and the deploy then
  # never runs. Read-only on the host: it does not run the kit's decide, which
  # hot-updates the host over SSM. Same conditions,
  # runner, environment, role and region as the deploy job, so it runs
  # on every path that can reach the deploy, allow_restart dispatches
  # included; it is never skipped for them. Replacement policy:
  # PREVIEW_ALLOW_REPLACEMENT is 'true' only for a workflow_dispatch with
  # allow_restart (a human's decision to stop/start or replace the host), and
  # then a replacement (True or Conditional) is listed as "replacement allowed
  # by allow_restart" rather than failing. Removals, a failed change set and
  # an AmiId other than the pin fail in both modes. The delete step runs
  # always() and fails the job unless the change set was deleted or verifiably
  # does not exist.
  preview:
    needs: changed
    if: >-
      github.ref == 'refs/heads/main'
      && needs.changed.outputs.deploy == 'true'
      && (github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.head_branch == 'main'
              && github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    environment: agent-deploy
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@agentworkforce'

      - name: Install
        working-directory: agent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.LAYERED_AGENT_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: layered-agent-preview-${{ github.run_id }}

      - name: Preview the compute stack change set
        env:
          PREVIEW_ALLOW_REPLACEMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_restart && 'true' || 'false' }}
        run: agent/preview-change-set.sh run "preview-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Delete the change set
        if: always()
        run: agent/preview-change-set.sh delete "preview-${{ github.run_id }}-${{ github.run_attempt }}"

  deploy:
    needs: [changed, preview]
    # Only main's copy of agent/ may reach the host: a dispatch from any
    # other ref (anyone with write access can start one) is a no-op.
    # Agent CI runs on every push to main, so main's head always gets its
    # own run, and an automatic deploy follows only a green run on main
    # whose commit is still main's head: the kit checks out github.sha, so
    # a run that finished after main moved on is skipped and the newer
    # head's own run deploys instead, and only when the changed job found
    # agent/ or its workflows changed since the last successful deploy, and
    # only after the preview job passed. A skipped, failed or cancelled
    # preview never deploys, allow_restart or not.
    if: >-
      github.ref == 'refs/heads/main'
      && !cancelled()
      && needs.changed.result == 'success'
      && needs.changed.outputs.deploy == 'true'
      && needs.preview.result == 'success'
      && (github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.head_branch == 'main'
              && github.event.workflow_run.head_sha == github.sha))
    # One deploy at a time against the one stack and host, taken only by a job
    # that runs (a skipped job never enters the group). An automatic run
    # enters the group only when agent/ or its workflows changed since the
    # last successful deploy, so a queued allow_restart dispatch is displaced
    # only by a landing under agent/ itself: GitHub keeps one pending run per
    # group, and a newer one cancels the pending one. A displaced dispatch
    # shows as cancelled and must be re-dispatched.
    concurrency:
      group: agent-deploy-dev
      cancel-in-progress: false
    # layered-agents is private and this repository is public, so the deploy
    # cannot call the kit's reusable workflow (GitHub refuses it before any
    # job starts). It checks the kit out instead with a short-lived,
    # contents:read App token and runs its composite deploy action from that
    # local path. A composite action cannot set the runner, environment
    # (part of the deploy role's OIDC subject), permissions or a timeout, so
    # the job sets them; Settle is bounded at 30 minutes, the job at 60.
    runs-on: ubuntu-latest
    environment: agent-deploy
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Kit read token
        id: kit-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_PUSHER_ID }}
          private-key: ${{ secrets.GH_APP_PUSHER_PRIVATE_KEY }}
          owner: AgentWorkforce
          repositories: layered-agents
          permission-contents: read

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the layered-agents kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AgentWorkforce/layered-agents
          ref: main
          token: ${{ steps.kit-token.outputs.token }}
          path: .layered-agents
          persist-credentials: false

      - name: Deploy
        uses: ./.layered-agents/.github/actions/layered-agent-deploy
        with:
          role-arn: ${{ vars.LAYERED_AGENT_DEPLOY_ROLE_ARN }}
          agent-dir: agent
          stage: dev
          allow-restart: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_restart }}

  # Leaves a record of what was deployed: the next run reads the head sha of
  # this artifact's run to know what was last deployed.
  record:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Write the deployed sha
        run: echo "${{ github.sha }}" > deployed-sha
      - name: Upload the deploy record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-deployed
          path: deployed-sha
          retention-days: 90
          if-no-files-found: error
