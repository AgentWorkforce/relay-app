    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the Swift test build
        uses: ./.github/actions/swift-cache
        with:
          arch: ${{ matrix.arch }}
          lane: tests

      # RelayDesktopTests depends on the executable target, so this also
      # compiles the app entrypoint when unsigned packaging is not selected.
      - name: Test the Swift package
        env:
          REQUEST_RENDER_DIR: ${{ runner.temp }}/desktop-ui-fixtures
          SESSION_COLUMNS_PREVIEW: ${{ runner.temp }}/desktop-ui-fixtures
        run: |
          mkdir -p "$SESSION_COLUMNS_PREVIEW"
          swift test --package-path macos

      - name: Test the shared session overview package
        run: swift test --package-path shared/RelaySessionOverview

      - name: Upload Swift rendering fixtures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Swift-rendering-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-ui-fixtures
          if-no-files-found: ignore
          retention-days: 1

      - name: Install the Rust toolchain for native visibility
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache native visibility builds
        uses: ./.github/actions/rust-lane-cache
        with:
          legacy-key: probe-${{ matrix.arch }}-macos
          workspace: desktop-core
          lane: native-visibility
          # The immutable collector uses release; the isolated Core host uses debug.
          discard-profile: none

      - name: Build the collector for native visibility
        run: scripts/build-probe.sh --target '${{ matrix.rust_target }}' --version 0.0.0 --out probe-build

      - name: Test newly started threads in the native app
        env:
          RELAY_NATIVE_VISIBILITY_HOST: ${{ github.workspace }}/target/debug/examples/native_visibility_host
          RELAY_NATIVE_VISIBILITY_PROBE: ${{ github.workspace }}/probe-build/agent-relay-probe
          RELAY_NATIVE_VISIBILITY_ARTIFACTS: ${{ runner.temp }}/native-visibility
        run: |
          cargo build --manifest-path desktop-core/Cargo.toml --locked --example native_visibility_host
          cargo test --manifest-path desktop-core/Cargo.toml --locked --example native_visibility_host
          swift test --package-path macos --filter NativeVisibilityTests

      - name: Upload native visibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Native-visibility-macOS-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-visibility
          if-no-files-found: ignore
          retention-days: 1

  macos-core-tests:
    needs: changes
    if: needs.changes.outputs.macos_core == 'true'
    name: macOS core tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.macos-matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache the probe build
        uses: ./.github/actions/rust-lane-cache
        with:
          legacy-key: probe-${{ matrix.arch }}-macos
          lane: tests
          discard-profile: release

      # The public core's macOS tests run in relay's Probe CI.
      - name: Test the desktop core
        run: bash scripts/test-platform-cargo.sh --manifest-path desktop-core/Cargo.toml --locked --lib

  windows-package:
    needs: changes
    if: needs.changes.outputs.windows_package == 'true' && !inputs.skip-packages
    name: Windows package (${{ matrix.arch }})
    # The Linux GTK app, built natively with MSYS2's clang toolchain and GTK 4
    # for each architecture. Windows runners have a desktop session, so the
    # GTK harness runs without a virtual display.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.windows-matrix) }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      # A short cargo home: RelayHistory's fixtures hold paths close to
      # Windows' 260-character limit, which a cargo home inside the
      # workspace pushed over it when cargo checked the dependency out.
      CARGO_HOME: C:\ch
      # Git itself fetches the git dependencies, honouring core.longpaths.
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: always
      # These caches omit incremental state; do not spend time producing it.
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      # Scripts and fixtures keep their LF line endings, and long paths
      # check out.
      - name: Keep line endings and allow long paths
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Windows toolchain
        id: toolchain
        uses: ./.github/actions/windows-toolchain
        with:
          msystem: ${{ matrix.msystem }}

      - name: Cache the Cargo release dependencies
        id: build-cache
        uses: ./.github/actions/windows-build-cache
        with:
          arch: ${{ matrix.arch }}
          profile: release
          toolchain: ${{ steps.toolchain.outputs.identity }}

      # The Setup .exe is compiled with Inno Setup 6. windows-latest carries
      # it; windows-11-arm may not, so it is installed there.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install innosetup --no-progress -y
            } else {
              winget install --id JRSoftware.InnoSetup -e --scope machine --silent --accept-source-agreements --accept-package-agreements --disable-interactivity
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-Item $iscc | Format-List FullName, VersionInfo

      # Builds the release core and app (icon and version embedded) and
      # packages them with the GTK runtime, as zips and the Setup .exe.
      - name: Build the Windows package
        run: scripts/build-windows.sh --version 0.0.0 --arch '${{ matrix.arch }}' --out out --installer

      - name: Check the core's bridge commands
        run: bash scripts/check-probe-bridge.sh target/release/agent-relay-desktop-probe.exe

      # The packaged core runs with only the DLLs the zip carries.
      - name: Smoke test the packaged core
        run: |
          unzip -l 'out/AgentRelay-0.0.0-Windows-${{ matrix.arch }}.zip' | tail -n 1
          unpacked="$(cygpath -u "$RUNNER_TEMP")/unpacked"
          rm -rf "$unpacked" && mkdir -p "$unpacked"
          unzip -q 'out/AgentRelay-0.0.0-Windows-${{ matrix.arch }}.zip' -d "$unpacked"
          PATH=/c/Windows/System32 "$unpacked/AgentRelay-Windows-${{ matrix.arch }}/bin/agent-relay-probe.exe" --version

      # The headless install script installs the probe zip under a prefix and
      # logon task of its own, and the real core answers from it.
      - name: Test the headless install script
        shell: pwsh
        run: scripts/test-windows-install.ps1 -ProbeZip "out/AgentRelay-0.0.0-Windows-${{ matrix.arch }}-probe.zip" -Version 0.0.0

      # Setup installs per user where the updater expects the tree, takes a
      # logon task that windows/install.ps1 registered (the bare core, `relay
      # serve --headless`) over to the app with `--headless`, and its
      # uninstaller removes the install, the shortcut, the entry and the task.
      - name: Install and uninstall with Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "out\AgentRelay-0.0.0-Windows-${{ matrix.arch }}-Setup.exe"
          $task = "Agent Relay ($env:USERNAME)"
          schtasks /Create /TN $task /TR '"C:\fake\core\current\agent-relay-probe.exe" serve --headless' /SC ONLOGON /F | Out-Null
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $root = "$env:LOCALAPPDATA\Programs\AgentRelay"
          $app = "$root\0.0.0\AgentRelay-Windows-${{ matrix.arch }}\bin\agent-relay.exe"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Agent Relay.lnk"
          $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{C5377993-AE99-466F-A519-676A299A6C6D}_is1'
          foreach ($path in $app, "$root\unins000.exe", $shortcut, $entry) {
            if (-not (Test-Path $path)) { throw "Setup did not create $path" }
          }
          Get-ItemProperty $entry | Format-List DisplayName, DisplayVersion, InstallLocation
          $action = (Get-ScheduledTask -TaskPath '\' -TaskName $task).Actions[0]
          if ($action.Execute.Trim('"') -ine $app -or $action.Arguments -ne '--headless') { throw "Setup left the task running $($action.Execute) $($action.Arguments)" }
          # Setup over another product's Setup install (RemoveReplacedProduct):
          # the entry names the replaced product, which left a link handler
          # running from the install root and a desktop shortcut named after
          # it. Both go; a handler running from elsewhere stays.
          $classes = 'HKCU:\Software\Classes'
          $foreign = "$classes\agentrelaytestacme"
          $other = "$classes\agentrelaytestother"
          $otherCommand = '"C:\Program Files\Other\other.exe" "%1"'
          $replacedShortcut = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Acme Relay.lnk'
          try {
            Set-ItemProperty -Path $entry -Name DisplayName -Value 'Acme Relay'
            New-Item -Path "$foreign\shell\open\command" -Value ('"' + $app + '" "%1"') -Force | Out-Null
            New-ItemProperty -Path $foreign -Name 'URL Protocol' -Value '' -PropertyType String -Force | Out-Null
            New-Item -Path "$other\shell\open\command" -Value $otherCommand -Force | Out-Null
            New-ItemProperty -Path $other -Name 'URL Protocol' -Value '' -PropertyType String -Force | Out-Null
            Set-Content -LiteralPath $replacedShortcut -Value '' -Force
            Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
            if (Test-Path $foreign) { throw "Setup left the replaced product's link handler $foreign" }
            if (-not (Test-Path "$other\shell\open\command")) { throw "Setup removed the third-party link handler $other" }
            if ((Get-Item "$other\shell\open\command").GetValue('') -ne $otherCommand) { throw "Setup changed the third-party link handler $other" }
            if ($null -eq (Get-Item $other).GetValue('URL Protocol')) { throw "Setup changed the third-party link handler $other" }
            if (-not (Test-Path "$classes\agentrelay\shell\open\command")) { throw "Setup left no agentrelay link handler" }
            if (Test-Path -LiteralPath $replacedShortcut) { throw "Setup left the replaced product's shortcut $replacedShortcut" }
            $name = (Get-ItemProperty $entry).DisplayName
            if ($name -ne 'Agent Relay') { throw "Setup left the entry named $name" }
          } finally {
            foreach ($key in $foreign, $other) {
              if (Test-Path $key) { Remove-Item -Path $key -Recurse -Force }
            }
            if (Test-Path -LiteralPath $replacedShortcut) { Remove-Item -LiteralPath $replacedShortcut -Force }
          }
          Start-Process "$root\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller finishes removing its own folder just after it exits.
          for ($i = 0; $i -lt 30 -and (Test-Path $root); $i++) { Start-Sleep -Seconds 1 }
          foreach ($path in $root, $shortcut, $entry, 'HKCU:\Software\Classes\agentrelay') {
            if (Test-Path $path) { throw "The uninstaller left $path" }
          }
          if (Get-ScheduledTask -TaskPath '\' -TaskName $task -ErrorAction SilentlyContinue) { throw "The uninstaller left the task $task" }

      - name: Upload the Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AgentRelay-Windows-${{ matrix.arch }}
          path: |
            out/*.zip
            out/*.zip.sha256
            out/*-Setup.exe
            out/*-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Keep only reusable release dependencies in the cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/windows-build-cache-prune
        with:
          profile: release

  windows-tests:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    name: Windows tests (${{ matrix.arch }})
    # The Linux GTK app, built natively with MSYS2's clang toolchain and GTK 4
    # for each architecture. Windows runners have a desktop session, so the
    # GTK harness runs without a virtual display.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.windows-matrix) }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      # A short cargo home: RelayHistory's fixtures hold paths close to
      # Windows' 260-character limit, which a cargo home inside the
      # workspace pushed over it when cargo checked the dependency out.
      CARGO_HOME: C:\ch
      # Git itself fetches the git dependencies, honouring core.longpaths.
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: always
      # These caches omit incremental state; do not spend time producing it.
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      # Keep runtime checks while avoiding debug-symbol generation/linking and
      # large symbol archives in CI. Local developer profiles are unchanged.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      # Scripts and fixtures keep their LF line endings, and long paths
      # check out.
      - name: Keep line endings and allow long paths
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Windows toolchain
        id: toolchain
        uses: ./.github/actions/windows-toolchain
        with:
          msystem: ${{ matrix.msystem }}

      - name: Cache the Cargo test dependencies
        id: build-cache
        uses: ./.github/actions/windows-build-cache
        with:
          arch: ${{ matrix.arch }}
          profile: debug
          toolchain: ${{ steps.toolchain.outputs.identity }}

      - name: Test the desktop core's platform paths and session discovery
        run: 'cargo test --manifest-path desktop-core/Cargo.toml --locked --lib -- mcp_settings:: install:: login_item:: history::probe::inventory:: history::probe::history::wsl:: history::probe::history::wsl_capture:: history::probe::history::extra_claude::'

      - name: Test the app's wording and state
        run: cargo test --manifest-path gtk/Cargo.toml --locked --no-default-features --features gtk --lib

      - name: Test the app's window
        run: cargo test --manifest-path gtk/Cargo.toml --locked --no-default-features --features gtk --test linux_app_gtk

      - name: Test the app's hosting of the core
        run: cargo test --manifest-path gtk/Cargo.toml --locked --no-default-features --features gtk --test linux_app_hosting

      # Packaging already compiles and links the entrypoint when selected.
      # Otherwise keep all Windows entrypoints checked, without
      # making integration tests link production binaries they never execute.
      - name: Check the Windows entrypoints
        if: needs.changes.outputs.windows_package != 'true' || inputs.skip-packages
        run: |
          cargo check --manifest-path gtk/Cargo.toml --locked --features gtk --bins
          cargo check --manifest-path desktop-core/Cargo.toml --locked --bins

      - name: Keep only reusable test dependencies in the cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/windows-build-cache-prune
        with:
          profile: debug

  linux-package:
    needs: [changes, linux-core]
    if: needs.changes.outputs.linux_package == 'true' && !inputs.skip-packages
    name: Linux package (${{ matrix.arch }})
    # Ubuntu 22.04 ships GTK 4.6, the oldest the app runs on: the app is
    # built and tested against it, natively for each architecture.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
