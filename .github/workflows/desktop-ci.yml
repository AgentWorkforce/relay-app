      # build-gtk.sh records the site and link scheme the app is built for
      # beside it, which build-linux.sh checks: production's.
      - name: Build the app
        run: scripts/build-gtk.sh --version "$CI_PROBE_VERSION" --out app-build

      - name: Check the app's glibc floor
        run: scripts/check-glibc-floor.sh app-build/agent-relay --max "$GLIBC_FLOOR"

      - name: Build Linux packages
        run: |
          scripts/build-linux.sh --version "$CI_PROBE_VERSION" --arch '${{ matrix.arch }}' \
            --app app-build/agent-relay --probe probe-build/agent-relay-probe --out out

      - name: Upload Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
