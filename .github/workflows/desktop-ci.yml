name: Desktop CI
run-name: ${{ inputs.request-id && format('cloud-release/{0}', inputs.request-id) || 'Desktop CI' }}

# Pull requests use representative native architectures; pushes to main
# test every supported architecture. Desktop Release skips the test matrix
# for a commit that already passed here on main, and otherwise calls this
# workflow for the full test matrix before building signed packages.

on:
  pull_request:
    # Default types only: an `edited` event whose jobs all skip would replace a
    # failed run's checks on the same commit. A PR retargeted onto main gets CI
    # on its next push, or by closing and reopening it.
    branches:
      - main
  push:
    branches:
      - main

  workflow_call:
    inputs:
      full-matrix:
        description: Validate both supported architectures on every platform
        type: boolean
        default: false
      force-all:
        description: Run every component regardless of changed paths
        type: boolean
        default: false
      skip-packages:
        description: Run tests only; the Release caller builds the real packages afterwards
        type: boolean
        default: false
      probe-version:
        description: Version embedded in the Linux core shared with package and test jobs
        type: string
        default: '0.0.0'
      release-analytics:
        description: Embed the official analytics configuration in the Linux core (Desktop Release only)
        type: boolean
        default: false
      reuse-linux-core:
        description: Restore the checked Linux core already built by the Release caller
        type: boolean
        default: false
      core-only:
        description: Build only the checked Linux cores (Desktop Release, when Desktop CI already passed this commit on main)
        type: boolean
        default: false
    secrets:
      POSTHOG_API_KEY:
        description: Analytics ingestion key embedded only in release cores
        required: false
  workflow_dispatch:
    inputs:
      request-id:
        description: 'Cloud orchestration request ID.'
        required: false
        default: ''
        type: string
      full-matrix:
        description: Validate both supported architectures on every platform
        type: boolean
        default: false
      force-all:
        description: Run every component regardless of changed paths
        type: boolean
        default: false
      skip-packages:
        description: Run tests only; the Release caller builds the real packages afterwards
        type: boolean
        default: false
      probe-version:
        description: Version embedded in the Linux core shared with package and test jobs
        type: string
        default: '0.0.0'
      base-sha:
        description: Select lanes from the changes since this commit, as a pull request would (flows/ci.flow.ts); empty runs every lane
        type: string
        default: ''

concurrency:
  # PR runs collapse per pull request; direct pushes to main collapse together
  # so only the latest main commit consumes the full test matrix.
  # Reusable release runs inherit the caller's tag or workflow_dispatch context,
  # so they remain keyed by event and commit instead of joining the main group.
  # github.workflow is the caller name for reusable runs: keep this group
  # distinct from the caller's release lock and from ordinary CI.
  group: ci-checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'push-main' || format('{0}-{1}', github.event_name, github.sha)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

# Nothing in CI writes to the repository.
permissions:
  contents: read

env:
  CI_PROBE_VERSION: ${{ inputs.probe-version || '0.0.0' }}
  # The loopback site the core the Linux end-to-end test hosts is built for
  # (`AGENT_RELAY_SITE_URL`), where that test's fake Cloud serves: a port
  # below the ephemeral range, so no other connection takes it first.
  E2E_SITE_URL: http://127.0.0.1:29147
  # Main tests every architecture so Desktop Release can rely on its result.
  CI_FULL_MATRIX: ${{ inputs.full-matrix || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  # Runs for every pull request, including forks: GitHub-hosted, read-only
  # and without secrets.
  open-source:
    name: Public source check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check nothing internal is in the public source
        run: bash scripts/check-open-source.sh

  # Never run untrusted fork code on repository-configured runners. This small
  # GitHub-hosted lane still gives outside contributors useful checks.
  fork-checks:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    name: Public contribution checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Check the desktop core
        run: cargo check --manifest-path desktop-core/Cargo.toml --locked

      - name: Test the release notes tooling
        run: python3 scripts/test_release_notes.py

  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Changed components
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      # Reads earlier Desktop CI runs to find the last commit main passed.
      actions: read
    outputs:
      reused-run: ${{ steps.reuse.outputs.reused-run }}
      shell: ${{ steps.reuse.outputs.shell || steps.changes.outputs.shell }}
      probe: ${{ steps.reuse.outputs.probe || steps.changes.outputs.probe }}
      macos: ${{ steps.reuse.outputs.macos || steps.changes.outputs.macos }}
      macos_core: ${{ steps.reuse.outputs.macos_core || steps.changes.outputs.macos_core }}
      macos_package: ${{ steps.reuse.outputs.macos_package || steps.changes.outputs.macos_package }}
      macos-matrix: ${{ steps.matrices.outputs.macos }}
      linux-matrix: ${{ steps.matrices.outputs.linux }}
      linux-probe-matrix: ${{ steps.matrices.outputs.linux_probe }}
      windows-matrix: ${{ steps.matrices.outputs.windows }}
      linux: ${{ steps.reuse.outputs.linux || steps.changes.outputs.linux }}
      linux_core: ${{ steps.reuse.outputs.linux_core || steps.changes.outputs.linux_core }}
      linux_integration: ${{ steps.reuse.outputs.linux_integration || steps.changes.outputs.linux_integration }}
      linux_package: ${{ steps.reuse.outputs.linux_package || steps.changes.outputs.linux_package }}
      windows: ${{ steps.reuse.outputs.windows || steps.changes.outputs.windows }}
      windows_package: ${{ steps.reuse.outputs.windows_package || steps.changes.outputs.windows_package }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetch authenticated history during checkout, before credentials are removed.
          fetch-depth: 0

      - name: Select native architectures
        id: matrices
        env:
          FULL_MATRIX: ${{ env.CI_FULL_MATRIX }}
          LINUX_RUNNER: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
          LINUX_ARM64_RUNNER: ${{ vars.CI_LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
          LINUX_2204_RUNNER: ${{ vars.CI_LINUX_2204_RUNNER || 'ubuntu-22.04' }}
          LINUX_2204_ARM64_RUNNER: ${{ vars.CI_LINUX_2204_ARM64_RUNNER || 'ubuntu-22.04-arm' }}
          # Repository variables pick each runner, so moving a lane to another
          # provider is a settings change; each falls back to a GitHub-hosted
          # runner when its variable is unset.
          MACOS_ARM64_RUNNER: ${{ vars.CI_MACOS_ARM64_RUNNER || 'macos-15' }}
          MACOS_X64_RUNNER: ${{ vars.CI_MACOS_X64_RUNNER || 'macos-15-intel' }}
          WINDOWS_RUNNER: ${{ vars.CI_WINDOWS_RUNNER || 'windows-latest' }}
          WINDOWS_ARM64_RUNNER: ${{ vars.CI_WINDOWS_ARM64_RUNNER || 'windows-11-arm' }}
        run: |
          python3 - <<'PY_MATRIX'
          import json
          import os

          full = os.environ["FULL_MATRIX"] == "true"
          matrices = {
              "macos": [
                  {"runner": os.environ["MACOS_ARM64_RUNNER"], "arch": "arm64", "rust_target": "aarch64-apple-darwin"},
                  {"runner": os.environ["MACOS_X64_RUNNER"], "arch": "x64", "rust_target": "x86_64-apple-darwin"},
              ],
              "linux": [
                  {"runner": os.environ["LINUX_2204_RUNNER"], "arch": "x64", "rust_target": "x86_64-unknown-linux-gnu"},
                  {"runner": os.environ["LINUX_2204_ARM64_RUNNER"], "arch": "arm64", "rust_target": "aarch64-unknown-linux-gnu"},
              ],
              "linux_probe": [
                  {"runner": os.environ["LINUX_RUNNER"], "arch": "x64", "rust_target": "x86_64-unknown-linux-gnu", "zig_host": "x86_64-linux", "zig_sha256": "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea"},
                  {"runner": os.environ["LINUX_ARM64_RUNNER"], "arch": "arm64", "rust_target": "aarch64-unknown-linux-gnu", "zig_host": "aarch64-linux", "zig_sha256": "041ac42323837eb5624068acd8b00cd5777dac4cf91179e8dad7a7e90dd0c556"},
              ],
              "windows": [
                  {"runner": os.environ["WINDOWS_RUNNER"], "arch": "x64", "msystem": "CLANG64"},
                  {"runner": os.environ["WINDOWS_ARM64_RUNNER"], "arch": "arm64", "msystem": "CLANGARM64"},
              ],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, rows in matrices.items():
                  selected = rows if full else rows[:1]
                  print(f"{name}={json.dumps(selected, separators=(',', ':'))}", file=output)
          PY_MATRIX

      # Desktop Release trusts a passing main run for its commit, so a push
      # to main compares against the last commit main passed, not the previous
      # push: a component whose push run failed is tested again until green.
      - name: Find the last commit main passed
        id: last-green
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          if candidates="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/desktop-ci.yml/runs?branch=main&event=push&status=success&per_page=30" \
              --jq '.workflow_runs[].head_sha')"; then
            # No passing ancestor among recent runs: test every component.
            base=unavailable
            for sha in $candidates; do
              if [ "$sha" != "$HEAD_SHA" ] && git merge-base --is-ancestor "$sha" "$HEAD_SHA" 2>/dev/null; then
                base="$sha"
                break
              fi
            done
          else
            # Without the last passing commit, the previous push could be a
            # failed one: test every component rather than trust it.
            base=unavailable
            echo "::warning::Could not list earlier Desktop CI runs; testing every component."
          fi
          echo "Comparing $base..$HEAD_SHA"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Detect changed components
        id: changes
        env:
          BASE_SHA: ${{ steps.last-green.outputs.base || github.event.pull_request.base.sha || inputs.base-sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_ALL: ${{ inputs.force-all }}
          CORE_ONLY: ${{ inputs.core-only }}
        run: |
          # Compare the event base with the tested commit (the merge commit on
          # PRs). Missing or unavailable history conservatively runs all jobs.
          if [ "$CORE_ONLY" = true ]; then
            # Desktop Release found a passing Desktop CI run for this commit on
            # main: build only the versioned Linux cores its packages ship.
            python3 scripts/ci-changes.py --all \
              | sed -e 's/=true$/=false/' -e 's/^linux_core=false$/linux_core=true/' >> "$GITHUB_OUTPUT"
          elif [ "$FORCE_ALL" = true ]; then
            python3 scripts/ci-changes.py --all >> "$GITHUB_OUTPUT"
          elif [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            python3 scripts/ci-changes.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci-changes.py --base unavailable --head unavailable >> "$GITHUB_OUTPUT"
          fi


      # A squash changes the commit SHA, but not its source tree. Reuse only
      # a completed snapshot gate proving all lanes main currently needs.
      # Keep this main run (and its completion gates) for Desktop Release.
      - name: Reuse an identical tested snapshot
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION_JSON: ${{ toJSON(steps.changes.outputs) }}
          MATRICES_JSON: ${{ toJSON(steps.matrices.outputs) }}
        run: python3 scripts/ci-reuse.py find

  shellcheck:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    name: Shell scripts
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Lint the packaging scripts
        run: |
          shellcheck scripts/*.sh linux/agent-relay.postinst
          shellcheck -x scripts/dev-reload.sh

      - name: Test probe bridge validation
        run: bash scripts/test-probe-bridge.sh

      - name: Test CI change detection and snapshot reuse
        run: |
          python3 scripts/test_ci_changes.py
          python3 scripts/test_ci_reuse.py

      - name: Test the release notes tooling
        run: |
          python3 scripts/test_release_notes.py
          python3 scripts/test_release_version.py
          python3 scripts/test_release_workflow.py
          python3 scripts/test_release_candidate.py
          python3 scripts/test_release_workflow_cloud.py
          python3 scripts/test_desktop_feed_publish.py
          python3 scripts/test_desktop_feed_checks.py
          python3 scripts/test_package_windows.py
          python3 scripts/test_build_windows.py

      - name: Test the Linux probe glibc floor check
        run: bash scripts/test-glibc-floor.sh

      - name: Test the Linux installer
        run: bash scripts/test-linux-install.sh

      - name: Test the pull-model operator script
        run: bash scripts/test-agent-relay-desktop-update.sh

      # The layered agent's lane scripts (agent/*.sh). Its stack tests need
      # GitHub Packages, which this workflow may not request (Desktop
      # Release calls it with contents: read only), so they run in
      # agent-ci.yml.
      - name: Lint the agent lane scripts
        run: shellcheck agent/*.sh

      - name: Set up Node.js for the agent flows
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check the agent flows
        run: |
          npm --prefix flows ci --no-audit --no-fund --ignore-scripts
          npm --prefix flows run -s check


  probe:
    needs: changes
    if: needs.changes.outputs.probe == 'true'
    name: Probe
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Test Cargo binary target selection
        run: python3 scripts/test_cargo_target_selection.py

      - name: Test the platform-only Cargo test boundary
        run: python3 scripts/test_platform_cargo.py

      - name: Cache the desktop core build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop-core -> ../target

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Test dependency cache pruning
        run: node --test .github/actions/windows-build-cache-prune/main.test.cjs

      # The public core (its own suite, live Pi and Oh My Pi sessions, the
      # Claude mobile bridge) is tested in relay's Probe CI.
      - name: Test the mobile build inventory
        run: node --test scripts/mobile-build-inventory.test.mjs

      - name: Test the site normalization the build scripts share
        run: |
          bash scripts/test-site-origin.sh
          bash scripts/test-build-scripts.sh
          bash scripts/test-crate-overrides.sh
          bash scripts/test-build-app-options.sh
          python3 scripts/test_dev_reload.py

      # The app's view models, packaging and hosting tests need no GTK.
      - name: Test the app without its window
        run: bash scripts/test-platform-cargo.sh --manifest-path gtk/Cargo.toml --locked

      - name: Test the desktop core
        run: bash scripts/test-platform-cargo.sh --manifest-path desktop-core/Cargo.toml --locked

      - name: Check the core and app lockfiles agree
        run: |
          python3 scripts/test_lock_parity.py
          python3 scripts/check-lock-parity.py

      # Code-quality ratchet: each crate's rust-oleum.toml grandfathers existing
      # violations; a new one, or a regression past its ceiling, fails here.
      - name: Install rust-oleum
        run: cargo install rust-oleum --version 0.4.0 --locked

      - name: Check the app's code-quality ratchet
        working-directory: gtk
        run: rust-oleum --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Check the desktop core's code-quality ratchet
        working-directory: desktop-core
        run: rust-oleum --github-summary "$GITHUB_STEP_SUMMARY"

      # The Swift contract types are generated from the Rust registry; a
      # stale checked-in file fails here.
      - name: Check the generated contract
        run: |
          scripts/generate-contract.sh
          git diff --exit-code

  linux-core:
    needs: changes
    if: needs.changes.outputs.linux_core == 'true'
    name: Linux core (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.linux-probe-matrix) }}
    env:
      GLIBC_FLOOR: "2.34"
      ZIG_VERSION: "0.13.0"
      CARGO_ZIGBUILD_VERSION: "0.23.4"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the Release caller's checked Linux core
        if: inputs.reuse-linux-core
        uses: ./.github/actions/linux-core-artifact
        with:
          arch: ${{ matrix.arch }}
          rust-target: ${{ matrix.rust_target }}
          probe-version: ${{ env.CI_PROBE_VERSION }}

      - name: Install the Rust toolchain
        if: ${{ !inputs.reuse-linux-core }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache the Zig-built probe
        if: ${{ !inputs.reuse-linux-core }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Retain the old key+job namespace after renaming the producer.
          shared-key: ci-linux-probe-zig-v1-${{ matrix.arch }}-linux-probe-glibc
          workspaces: desktop-core -> ../target

      - name: Install zig and cargo-zigbuild
        if: ${{ !inputs.reuse-linux-core }}
        env:
          ZIG_HOST: ${{ matrix.zig_host }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}
        run: |
          set -euo pipefail
          archive="zig-linux-${ZIG_HOST%-linux}-$ZIG_VERSION.tar.xz"
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/$archive" -o "$RUNNER_TEMP/$archive"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${archive%.tar.xz}" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"

      - name: Build the probe against glibc 2.34
        if: ${{ !inputs.reuse-linux-core }}
        env:
          # Set only when Desktop Release calls this workflow with
          # release-analytics. A push or same-repository pull request can read
          # the repository secrets too, so the input, not the secrets block,
          # keeps CI, PR and fork builds free of analytics configuration.
          AGENT_RELAY_POSTHOG_API_KEY: ${{ inputs.release-analytics && secrets.POSTHOG_API_KEY || '' }}
        run: |
          scripts/build-probe.sh \
            --target '${{ matrix.rust_target }}' \
            --version "$CI_PROBE_VERSION" \
            --glibc "$GLIBC_FLOOR" \
            --out probe-build

      - name: Check the probe's glibc floor
        if: ${{ !inputs.reuse-linux-core }}
        run: scripts/check-glibc-floor.sh probe-build/agent-relay-probe --max "$GLIBC_FLOOR"

      - name: Record the checked core identity
        if: ${{ !inputs.reuse-linux-core }}
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          printf '%s\n' "$GITHUB_SHA" > probe-build/source-revision.txt
          printf '%s\n' "$RUST_TARGET" > probe-build/rust-target.txt

      - name: Upload the checked Linux core
        if: ${{ !inputs.reuse-linux-core }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Prefix avoids the release publisher's linux-* package pattern.
          name: ci-linux-core-${{ matrix.arch }}-${{ github.sha }}
          path: probe-build/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  macos-package:
    needs: changes
    if: needs.changes.outputs.macos_package == 'true' && !inputs.skip-packages
    name: macOS package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.macos-matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the Swift release build
        uses: ./.github/actions/swift-cache
        with:
          arch: ${{ matrix.arch }}
          lane: package

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache the probe build
        uses: ./.github/actions/rust-lane-cache
        with:
          legacy-key: probe-${{ matrix.arch }}-macos
          workspace: desktop-core
          lane: package
          discard-profile: debug

      - name: Build the probe
        run: scripts/build-probe.sh --target '${{ matrix.rust_target }}' --version 0.0.0 --out probe-build

      # No signing secrets in CI: build-app.sh ad-hoc signs and says so.
      - name: Assemble the app bundle
        run: |
          set -euo pipefail
          scripts/build-app.sh \
            --arch '${{ matrix.arch }}' \
            --version 0.0.0 \
            --probe probe-build \
            --out dist

      # The Agent Relay family marker (ProductTakeover.swift): a release build
      # carries its bundle id under AgentRelayProduct in its Info.plist and its
      # core's LaunchAgent; the development build and a --coexist build (a site
      # profile's DESKTOP_COEXIST) carry it in neither, so they never replace
      # or are replaced by another build. The dev build needs a probe built for
      # its site and link scheme; the --coexist build is the default site's
      # under its own bundle id, which would carry the marker without the flag.
      - name: Check the Agent Relay product marker
        run: |
          set -euo pipefail
          app='dist/Agent Relay.app'
          bundle_id="$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")"
          for plist in "$app/Contents/Info.plist" "$app/Contents/Library/LaunchAgents/$bundle_id.core.plist"; do
            marker="$(plutil -extract AgentRelayProduct raw "$plist" 2>/dev/null || true)"
            if [ "$marker" != "$bundle_id" ]; then
              echo "::error::$plist carries AgentRelayProduct '$marker', expected '$bundle_id'"
              exit 1
            fi
          done
          scripts/build-probe.sh --target '${{ matrix.rust_target }}' --version 0.0.0 --out probe-build-dev \
            --site-url http://localhost:3100 --url-scheme agentrelay-dev
          scripts/build-app.sh \
            --arch '${{ matrix.arch }}' \
            --version 0.0.0 \
            --probe probe-build-dev \
            --out dist-dev \
            --dev-site-url http://localhost:3100
          dev='dist-dev/Agent Relay Dev.app'
          for plist in "$dev/Contents/Info.plist" "$dev/Contents/Library/LaunchAgents/com.agentrelay.desktop.dev.core.plist"; do
            if [ ! -f "$plist" ]; then
              echo "::error::the development build has no $plist"
              exit 1
            fi
            if plutil -extract AgentRelayProduct raw "$plist" >/dev/null 2>&1; then
              echo "::error::the development build's $plist carries AgentRelayProduct"
              exit 1
            fi
          done
          rm -rf dist-dev probe-build-dev
          refused="$(scripts/build-app.sh --arch '${{ matrix.arch }}' --version 0.0.0 --probe probe-build \
              --out dist-coexist --coexist 2>&1 || true)"
          if ! grep -qF -- '--coexist needs its own --bundle-id' <<<"$refused"; then
            echo "::error::build-app.sh --coexist did not refuse the production bundle id"
            exit 1
          fi
          scripts/build-app.sh \
            --arch '${{ matrix.arch }}' \
            --version 0.0.0 \
            --probe probe-build \
            --out dist-coexist \
            --product-name 'Agent Relay Coexist' \
            --bundle-id com.agentrelay.desktop.coexist \
            --coexist
          coexist='dist-coexist/Agent Relay Coexist.app'
          for plist in "$coexist/Contents/Info.plist" "$coexist/Contents/Library/LaunchAgents/com.agentrelay.desktop.coexist.core.plist"; do
            if [ ! -f "$plist" ]; then
              echo "::error::the --coexist build has no $plist"
              exit 1
            fi
            if plutil -extract AgentRelayProduct raw "$plist" >/dev/null 2>&1; then
              echo "::error::the --coexist build's $plist carries AgentRelayProduct"
              exit 1
            fi
          done
          rm -rf dist-coexist

      - name: Set up Python for disk image tooling
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install disk image tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-tools"
          "$RUNNER_TEMP/dmg-tools/bin/python" -m pip install -r scripts/dmg-requirements.txt
          echo "$RUNNER_TEMP/dmg-tools/bin" >> "$GITHUB_PATH"

      - name: Package a disk image (smoke test)
        run: |
          set -euo pipefail
          scripts/package-dmg.sh \
            --app 'dist/Agent Relay.app' \
            --out 'dist/AgentRelay-CI-${{ matrix.arch }}.dmg'

      - name: Zip the app bundle
        run: ditto -c -k --keepParent 'dist/Agent Relay.app' "AgentRelay-macOS-${{ matrix.arch }}.zip"

      - name: Upload the app bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AgentRelay-macOS-${{ matrix.arch }}
          path: AgentRelay-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

  macos-swift-tests:
    needs: changes
