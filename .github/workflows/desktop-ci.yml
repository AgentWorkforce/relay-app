            echo "Native architectures tested when this component is selected: $SELECTED_ARCHITECTURES"
            echo "Architectures deferred: $DEFERRED_ARCHITECTURES"
            echo "Tests selected: $CHANGED; packaging selected: $PACKAGE_CHANGED; unsigned package checks skipped: $SKIP_PACKAGES"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CHANGES_RESULT" = success
          case "$CHANGED" in true|false) ;; *) exit 1 ;; esac
          case "$SKIP_PACKAGES" in true|false) ;; *) exit 1 ;; esac
          case "$PACKAGE_CHANGED" in true|false) ;; *) exit 1 ;; esac
          if [ "$PACKAGE_CHANGED" = true ]; then test "$CHANGED" = true; fi
          if [ "$CHANGED" = true ]; then
            test "$WINDOWS_TESTS_RESULT" = success
          else
            test "$WINDOWS_TESTS_RESULT" = skipped
          fi
          if [ "$PACKAGE_CHANGED" = true ] && [ "$SKIP_PACKAGES" = false ]; then
            test "$WINDOWS_PACKAGE_RESULT" = success
          else
            test "$WINDOWS_PACKAGE_RESULT" = skipped
          fi

  linux:
    # Legacy architecture labels are compatibility completion gates over the
    # SELECTED matrix; the summary states actual and deferred native coverage.
    name: Linux ${{ matrix.arch }}
    needs: [changes, linux-core, linux-package, linux-tests]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Check all selected Linux lanes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGED: ${{ needs.changes.outputs.linux }}
          CORE_CHANGED: ${{ needs.changes.outputs.linux_core }}
          INTEGRATION_CHANGED: ${{ needs.changes.outputs.linux_integration }}
          PACKAGE_CHANGED: ${{ needs.changes.outputs.linux_package }}
          SKIP_PACKAGES: ${{ inputs.skip-packages && 'true' || 'false' }}
          SELECTED_ARCHITECTURES: ${{ env.CI_FULL_MATRIX == 'true' && 'arm64, x64' || 'x64' }}
          DEFERRED_ARCHITECTURES: ${{ env.CI_FULL_MATRIX == 'true' && 'none' || 'arm64 (main and Desktop Release)' }}
          LINUX_CORE_RESULT: ${{ needs.linux-core.result }}
          LINUX_PACKAGE_RESULT: ${{ needs.linux-package.result }}
          LINUX_TESTS_RESULT: ${{ needs.linux-tests.result }}
        run: |
          {
            echo 'This legacy architecture label is a compatibility completion gate over the selected matrix.'
            echo "Native architectures tested when this component is selected: $SELECTED_ARCHITECTURES"
            echo "Architectures deferred: $DEFERRED_ARCHITECTURES"
            echo "GTK tests selected: $CHANGED; core build selected: $CORE_CHANGED; integration selected: $INTEGRATION_CHANGED; packaging selected: $PACKAGE_CHANGED; unsigned package checks skipped: $SKIP_PACKAGES"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CHANGES_RESULT" = success
          case "$CHANGED" in true|false) ;; *) exit 1 ;; esac
          case "$CORE_CHANGED" in true|false) ;; *) exit 1 ;; esac
          case "$INTEGRATION_CHANGED" in true|false) ;; *) exit 1 ;; esac
          case "$PACKAGE_CHANGED" in true|false) ;; *) exit 1 ;; esac
          case "$SKIP_PACKAGES" in true|false) ;; *) exit 1 ;; esac
          if [ "$INTEGRATION_CHANGED" = true ] || [ "$PACKAGE_CHANGED" = true ]; then
            test "$CORE_CHANGED" = true
          fi
          if [ "$CHANGED" = true ] || [ "$INTEGRATION_CHANGED" = true ]; then
            test "$LINUX_TESTS_RESULT" = success
          else
            test "$LINUX_TESTS_RESULT" = skipped
          fi
          if [ "$CORE_CHANGED" = true ]; then
            test "$LINUX_CORE_RESULT" = success
          else
            test "$LINUX_CORE_RESULT" = skipped
          fi
          if [ "$PACKAGE_CHANGED" = true ] && [ "$SKIP_PACKAGES" = false ]; then
            test "$LINUX_PACKAGE_RESULT" = success
          else
            test "$LINUX_PACKAGE_RESULT" = skipped
          fi

  linux-probe-glibc:
    # Preserve both former required-check names over the selected native matrix.
    name: Linux probe glibc 2.34 (${{ matrix.arch }})
    needs: [changes, linux-core]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Check the selected Linux core builds
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGED: ${{ needs.changes.outputs.linux_core }}
          CORE_RESULT: ${{ needs.linux-core.result }}
          SELECTED_ARCHITECTURES: ${{ env.CI_FULL_MATRIX == 'true' && 'arm64, x64' || 'x64' }}
          DEFERRED_ARCHITECTURES: ${{ env.CI_FULL_MATRIX == 'true' && 'none' || 'arm64 (main and Desktop Release)' }}
        run: |
          {
            echo 'This legacy architecture label is a compatibility completion gate over the selected matrix.'
            echo "Linux cores checked against glibc 2.34 when selected: $SELECTED_ARCHITECTURES"
            echo "Architectures deferred: $DEFERRED_ARCHITECTURES"
            echo "Component selected: $CHANGED"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CHANGES_RESULT" = success
          case "$CHANGED" in true|false) ;; *) exit 1 ;; esac
          if [ "$CHANGED" = true ]; then
            test "$CORE_RESULT" = success
          else
            test "$CORE_RESULT" = skipped
          fi

  snapshot-evidence:
    name: Record successful snapshot gate
    # A run's successful conclusion is checked independently by the consumer.
    # Reruns use a separate artifact per attempt; stale attempts never count.
    needs: [changes, open-source, shellcheck, probe, linux-core, macos-package, macos-swift-tests, macos-core-tests, windows-package, windows-tests, linux-package, linux-tests, macos, windows, linux, linux-probe-glibc]
    if: >-
      always() && !failure() && !cancelled() &&
      github.event_name == 'workflow_dispatch' && inputs.full-matrix &&
      !inputs.skip-packages && !inputs.core-only && !inputs.reuse-linux-core &&
      !inputs.release-analytics && (inputs.probe-version == '' || inputs.probe-version == '0.0.0') &&
      startsWith(github.ref, 'refs/heads/ci/')
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the tested snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bind successful lanes and runners to the exact source tree
        env:
          SELECTION_JSON: ${{ toJSON(needs.changes.outputs) }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          FULL_MATRIX: ${{ env.CI_FULL_MATRIX }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: python3 scripts/ci-reuse.py record --path evidence.json

      - name: Save snapshot evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-ci-evidence-${{ github.run_attempt }}
          path: evidence.json
          if-no-files-found: error
          retention-days: 7
