name: Mobile CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'ipad/native/**'
      - 'shared/RelaySessionOverview/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ipad/native/**'
      - 'shared/RelaySessionOverview/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:
    inputs:
      extra-ui-tests:
        description: >-
          Comma-separated AgentRelayUITests classes to run in addition to
          the standard set, for example KeyboardDismissUITests,RelayPhoneUITests
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: iPhone handoff and unit tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate extra UI test classes
        id: extra
        env:
          # Empty on push and pull_request; only a manual dispatch sets it.
          EXTRA_UI_TESTS: ${{ inputs.extra-ui-tests }}
        run: |
          classes=()
          IFS=',' read -r -a extra_classes <<< "${EXTRA_UI_TESTS:-}"
          for raw in "${extra_classes[@]}"; do
            class="${raw//[[:space:]]/}"
            if [ -z "$class" ]; then
              continue
            fi
            if ! [[ "$class" =~ ^[A-Za-z0-9_]+$ ]]; then
              echo "::error::extra-ui-tests entry '$class' is not a test class name (letters, digits and _ only)"
              exit 1
            fi
            classes+=("$class")
          done
          # Only validated class names reach the output.
          (IFS=','; echo "classes=${classes[*]}") >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ipad/native/project.yml

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          inventory = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]))
          phones = [device for runtime, devices in inventory["devices"].items()
                    if ".iOS-" in runtime for device in devices
                    if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not phones:
              raise SystemExit("No available iPhone simulator installed")
          phone = phones[0]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("udid=" + phone["udid"] + "\n")
          print("Testing on " + phone["name"])
          PY

      # A cold simulator left to xcodebuild boots while the first test waits,
      # so that test's launch or readiness wait times out. Boot it up front
      # and block until booting, data migration included, has finished.
      - name: Boot the simulator
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          if ! output=$(xcrun simctl boot "$SIMULATOR_UDID" 2>&1); then
            if ! grep -q "current state: Booted" <<< "$output"; then
              echo "$output"
              exit 1
            fi
            echo "Simulator already booted"
          fi
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build for testing
        id: build
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild build-for-testing \
            -project ipad/native/AgentRelayiPad.xcodeproj \
            -scheme AgentRelayiPad \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild test-without-building \
            -project ipad/native/AgentRelayiPad.xcodeproj \
            -scheme AgentRelayiPad \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/MobileUnit.xcresult" \
            -parallel-testing-enabled NO \
            -skipPackagePluginValidation \
            -only-testing:AgentRelayUnitTests \
            CODE_SIGNING_ALLOWED=NO

      # Runs in its own xcodebuild invocation, so the first UI launch no
      # longer follows the unit tests in the same run, and runs after a unit
      # test failure too, so one run reports both; either failure fails the job.
      - name: Test mobile handoff without production credentials
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          EXTRA_UI_CLASSES: ${{ steps.extra.outputs.classes }}
        run: |
          only_testing=(-only-testing:AgentRelayUITests/MobileHandoffUITests)
          only_testing+=(-only-testing:AgentRelayUITests/AgentRowUITests)
          only_testing+=(-only-testing:AgentRelayUITests/SessionStreamUITests)
          IFS=',' read -r -a extra_classes <<< "${EXTRA_UI_CLASSES:-}"
          for class in "${extra_classes[@]}"; do
            only_testing+=("-only-testing:AgentRelayUITests/$class")
          done
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcodebuild test-without-building \
            -project ipad/native/AgentRelayiPad.xcodeproj \
            -scheme AgentRelayiPad \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/MobileHandoff.xcresult" \
            -parallel-testing-enabled NO \
            -skipPackagePluginValidation \
            "${only_testing[@]}" \
            CODE_SIGNING_ALLOWED=NO

      # The sidebar toggle exists only at iPad width, so its UI test runs on
      # an iPad simulator, from the same build, after the iPhone tests.
      - name: Select an available iPad simulator
        id: ipad_simulator
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          inventory = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]))
          ipads = [device for runtime, devices in inventory["devices"].items()
                   if ".iOS-" in runtime for device in devices
                   if device.get("isAvailable") and device["name"].startswith("iPad")]
          if not ipads:
              raise SystemExit("No available iPad simulator installed")
          # Fewer screen pixels make a lighter simulator. Each preferred
          # model is at least 744 points wide in portrait, the orientation
          # the test runs in, so it gets the iPad layout (700 or more).
          # The base iPad (820 points) comes first because it leaves the
          # most room beside the sidebar; any iPad is the fallback.
          preferred = ["iPad (", "iPad mini", "iPad Air 11-inch", "iPad Pro 11-inch"]
          def rank(device):
              for index, prefix in enumerate(preferred):
                  if device["name"].startswith(prefix):
                      return index
              return len(preferred)
          ipad = min(ipads, key=rank)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("udid=" + ipad["udid"] + "\n")
          print("Testing on " + ipad["name"])
          PY

      # Nothing after the iPad steps uses the iPhone simulator: the export
      # and upload steps read only the result bundles. Shutting it down
      # leaves the runner to the iPad alone.
      - name: Boot the iPad simulator
        if: ${{ !cancelled() && steps.ipad_simulator.outcome == 'success' }}
        env:
          IPHONE_UDID: ${{ steps.simulator.outputs.udid }}
          SIMULATOR_UDID: ${{ steps.ipad_simulator.outputs.udid }}
        run: |
          if ! xcrun simctl shutdown "$IPHONE_UDID"; then
            echo "The iPhone simulator was not running"
          fi
          if ! output=$(xcrun simctl boot "$SIMULATOR_UDID" 2>&1); then
            if ! grep -q "current state: Booted" <<< "$output"; then
              echo "$output"
              exit 1
            fi
            echo "Simulator already booted"
          fi
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      # A loaded runner can kill the test runner before it starts any test
      # ("never finished bootstrapping"). Only that is retried, once, into a
      # fresh result bundle; a test that started and failed fails the step.
      - name: Test the iPad sidebar toggle
        if: ${{ !cancelled() && steps.ipad_simulator.outcome == 'success' }}
        env:
          SIMULATOR_UDID: ${{ steps.ipad_simulator.outputs.udid }}
        run: |
          set -o pipefail
          sidebar_tests() {
            xcrun simctl bootstatus "$SIMULATOR_UDID" -b
            xcodebuild test-without-building \
              -project ipad/native/AgentRelayiPad.xcodeproj \
              -scheme AgentRelayiPad \
              -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -resultBundlePath "$RUNNER_TEMP/MobileSidebar.xcresult" \
              -parallel-testing-enabled NO \
              -skipPackagePluginValidation \
              -only-testing:AgentRelayUITests/SidebarCollapseUITests \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$1"
          }
          if sidebar_tests "$RUNNER_TEMP/MobileSidebar-attempt1.log"; then
            exit 0
          fi
          if grep -Eq "^Test [Cc]ase '.*' started" "$RUNNER_TEMP/MobileSidebar-attempt1.log"; then
            exit 1
          fi
          echo "::warning::The iPad UI test runner started no test case; retrying once."
          if [ -d "$RUNNER_TEMP/MobileSidebar.xcresult" ]; then
            mv "$RUNNER_TEMP/MobileSidebar.xcresult" "$RUNNER_TEMP/MobileSidebar-attempt1.xcresult"
          fi
          sidebar_tests "$RUNNER_TEMP/MobileSidebar-attempt2.log"

      # MobileHandoff and MobileSidebar are the UI test bundles and MobileUnit
      # the unit test bundle; each is absent when its step did not get to run.
      - name: Export viewable interaction screenshots
        if: always()
        run: |
          export_attachments() {
            mkdir -p "$RUNNER_TEMP/$1-attachments" || return 1
            xcrun xcresulttool export attachments --help || return 1
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/$1.xcresult" \
              --output-path "$RUNNER_TEMP/$1-attachments" || return 1
          }
          failed=0
          for bundle in MobileHandoff MobileSidebar MobileUnit; do
            if [ -d "$RUNNER_TEMP/$bundle.xcresult" ]; then
              export_attachments "$bundle" || failed=1
            fi
          done
          exit "$failed"

      - name: Export simulator diagnostics and app console
        if: always()
        run: |
          export_diagnostics() {
            mkdir -p "$RUNNER_TEMP/$1-diagnostics" || return 1
            xcrun xcresulttool export diagnostics --help || return 1
            xcrun xcresulttool export diagnostics \
              --path "$RUNNER_TEMP/$1.xcresult" \
              --output-path "$RUNNER_TEMP/$1-diagnostics" || return 1
            xcrun xcresulttool get log --help || return 1
            if ! xcrun xcresulttool get log \
              --path "$RUNNER_TEMP/$1.xcresult" --type console \
              > "$RUNNER_TEMP/$1-console.json"; then
              echo "::warning::$1 bundle-wide console export unavailable; simulator diagnostics are preserved."
            fi
          }
          failed=0
          for bundle in MobileHandoff MobileSidebar MobileUnit; do
            if [ -d "$RUNNER_TEMP/$bundle.xcresult" ]; then
              export_diagnostics "$bundle" || failed=1
            fi
          done
          exit "$failed"

      - name: Preserve test results and interaction screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-handoff-test-results
          path: |
            ${{ runner.temp }}/MobileHandoff.xcresult
            ${{ runner.temp }}/MobileHandoff-attachments
            ${{ runner.temp }}/MobileHandoff-diagnostics
            ${{ runner.temp }}/MobileHandoff-console.json
            ${{ runner.temp }}/MobileSidebar.xcresult
            ${{ runner.temp }}/MobileSidebar-attempt1.xcresult
            ${{ runner.temp }}/MobileSidebar-attachments
            ${{ runner.temp }}/MobileSidebar-diagnostics
            ${{ runner.temp }}/MobileSidebar-console.json
            ${{ runner.temp }}/MobileUnit.xcresult
            ${{ runner.temp }}/MobileUnit-attachments
            ${{ runner.temp }}/MobileUnit-diagnostics
            ${{ runner.temp }}/MobileUnit-console.json
          if-no-files-found: ignore
          retention-days: 7
