          $names = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_SUBSCRIPTION_ID',
            'TRUSTED_SIGNING_ENDPOINT', 'TRUSTED_SIGNING_ACCOUNT', 'TRUSTED_SIGNING_CERT_PROFILE'
          $missing = @($names | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing) {
            $message = "Building unsigned: the repository variables $($missing -join ', ') are not set."
            Write-Output "::warning title=Windows signing skipped::$message"
            Write-Output "Windows signing skipped. $message"
            'sign=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $endpoint = $null
          if (-not [Uri]::TryCreate($env:TRUSTED_SIGNING_ENDPOINT, 'Absolute', [ref]$endpoint) -or $endpoint.Scheme -ne 'https') {
            throw 'TRUSTED_SIGNING_ENDPOINT is not an https URL'
          }
          Write-Output "Signing with Azure Trusted Signing at $($endpoint.Host)."
          'sign=true' >> $env:GITHUB_OUTPUT

      - name: Sign in for Windows signing
        id: sign-in
        if: steps.signing.outputs.sign == 'true'
        uses: ./.github/actions/windows-sign
        with:
          mode: setup
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          account: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile: ${{ vars.TRUSTED_SIGNING_CERT_PROFILE }}

      # When signing, every PE file is signed before it is zipped, and Inno
      # signs Setup and its uninstaller.
      - name: Assemble the captured runtimes and build packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGN_COMMAND: ${{ steps.sign-in.outputs.sign-command }}
        run: |
          $signing = if ($env:SIGN_COMMAND) { @('--sign-command', $env:SIGN_COMMAND) } else { @() }
          python scripts/package-windows.py --version "$env:VERSION" --arch 'arm64' `
            --app-runtime compiled/app --core-runtime compiled/core --out out --installer `
            --source-sha '${{ needs.version.outputs.source-sha }}' @signing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content -Encoding ascii -Path 'out/probe-version-windows-arm64.txt' -Value $env:VERSION

      # Every PE file in both zips, and Setup, must carry a valid signature.
      - name: Verify Windows signatures
        id: verify-signatures
        uses: ./.github/actions/windows-sign
        with:
          mode: verify
          sign: ${{ steps.signing.outputs.sign }}
          archives: |
            out/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-arm64.zip
            out/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-arm64-probe.zip
          files: out/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-arm64-Setup.exe

      # Use only the DLLs shipped with the package, rather than a build host's PATH.
      - name: Smoke test the packaged core
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked'
          Expand-Archive -LiteralPath "out/$env:ASSET_PREFIX-$env:VERSION-Windows-arm64.zip" -DestinationPath $unpacked -Force
          $env:PATH = "$env:SystemRoot\System32"
          & "$unpacked/AgentRelay-Windows-arm64/bin/agent-relay-probe.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Setup installs per user where the updater expects the tree, and its
      # uninstaller removes the install, the shortcut and the entry. A signed
      # build's installed uninstaller must carry a valid signature.
      - name: Install and uninstall with Setup
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGN: ${{ steps.signing.outputs.sign }}
          SIGNTOOL: ${{ steps.verify-signatures.outputs.signtool }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          $setup = "out\$env:ASSET_PREFIX-$version-Windows-arm64-Setup.exe"
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $root = "$env:LOCALAPPDATA\Programs\AgentRelay"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Agent Relay.lnk"
          $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{C5377993-AE99-466F-A519-676A299A6C6D}_is1'
          foreach ($path in "$root\$version\AgentRelay-Windows-arm64\bin\agent-relay.exe", "$root\unins000.exe", $shortcut, $entry) {
            if (-not (Test-Path $path)) { throw "Setup did not create $path" }
          }
          Get-ItemProperty $entry | Format-List DisplayName, DisplayVersion, InstallLocation
          if ($env:SIGN -eq 'true') {
            & $env:SIGNTOOL verify /pa /v "$root\unins000.exe" "$root\$version\AgentRelay-Windows-arm64\bin\agent-relay.exe"
            if ($LASTEXITCODE -ne 0) { throw "The installed uninstaller or app is not validly signed ($LASTEXITCODE)" }
          }
          Start-Process "$root\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller finishes removing its own folder just after it exits.
          for ($i = 0; $i -lt 30 -and (Test-Path $root); $i++) { Start-Sleep -Seconds 1 }
          foreach ($path in $root, $shortcut, $entry, "HKCU:\Software\Classes\$env:URL_SCHEME") {
            if (Test-Path $path) { throw "The uninstaller left $path" }
          }

      - name: Remove the unpacked staging tree
        run: Remove-Item -Recurse -Force 'out/AgentRelay-Windows-arm64'

      - name: Upload the Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-arm64
          path: out/
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Windows packages complete
    needs: [version, package-windows-x64, package-windows-arm64]
    if: >-
      always() && !cancelled() && needs.version.outputs.skip != 'true' && needs.package-windows-x64.result == 'success' &&
      needs.package-windows-arm64.result == 'success'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - run: echo 'Both Windows architectures passed packaging and installer checks.'

  publish:
    name: Publish to relay-desktop-releases
    needs:
      - version
      - ci-status
      - pre-release
      - release-core
      - build
      - build-linux
      - build-windows
    # Verification and packaging overlap. A skipped fallback matrix is safe
    # only when this exact commit passed Desktop CI on main.
    if: >-
      always() && !cancelled() && needs.version.outputs.skip != 'true' &&
      needs.version.result == 'success' && needs.ci-status.result == 'success' &&
      needs.release-core.result == 'success' && needs.build.result == 'success' &&
      needs.build-linux.result == 'success' && needs.build-windows.result == 'success' &&
      (needs.pre-release.result == 'success' ||
        (needs.ci-status.outputs.tested == 'true' && needs.pre-release.result == 'skipped'))
    runs-on: ${{ vars.DEPLOY_LINUX_RUNNER || 'ubuntu-latest' }}
    environment: ${{ inputs.profile && format('desktop-{0}', inputs.profile) || '' }}
    permissions:
      contents: read
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source-sha }}
          persist-credentials: false

      # The profile's releases repository (RELEASES_REPOSITORY) and the
      # credentials that write to it (the releases App's secrets, or
      # RELEASES_TOKEN) come from its environment.
      - name: Resolve the site profile
        uses: ./.github/actions/site-profile
        with:
          profile: ${{ inputs.profile }}
          site-url: ${{ secrets.AGENT_RELAY_SITE_URL }}
          url-scheme: ${{ secrets.AGENT_RELAY_URL_SCHEME }}
          product-name: ${{ secrets.DESKTOP_PRODUCT_NAME }}
          bundle-id: ${{ secrets.DESKTOP_BUNDLE_ID }}
          releases-repository: ${{ secrets.RELEASES_REPOSITORY }}
          release-feed: ${{ secrets.RELEASE_FEED }}
          feed-public-key: ${{ secrets.DESKTOP_FEED_PUBLIC_KEY }}
          feed-publisher-token-set: ${{ secrets.DESKTOP_FEED_PUBLISHER_TOKEN != '' }}
          support-url: ${{ secrets.DESKTOP_SUPPORT_URL }}
          policy-defaults: ${{ secrets.DESKTOP_POLICY_DEFAULTS }}
          history-upload-storage-origins: ${{ secrets.DESKTOP_HISTORY_UPLOAD_STORAGE_ORIGINS }}

      # Publishing prefers a short-lived GitHub App installation token,
      # minted here for the releases repository alone, over the long-lived
      # RELEASES_TOKEN: a profile sets DESKTOP_RELEASES_APP_ID and
      # DESKTOP_RELEASES_APP_PRIVATE_KEY in its environment; the default
      # profile sets RELEASES_APP_ID and RELEASES_APP_PRIVATE_KEY as repository
      # secrets (an App installed on the organisation with access limited to
      # the releases repository, Contents read/write and Metadata read). The
      # names differ on purpose: an environment secret shadows a repository
      # secret of the same name but cannot hide one, so a profile selects its
      # own pair and never inherits the default's. RELEASES_TOKEN remains the
      # fallback when the selected pair is unset.
      # A cloud feed publishes with its publisher token instead: it needs
      # no App, no RELEASES_TOKEN and no releases repository.
      - name: Check for the releases App
        id: releases-app
        if: env.RELEASE_FEED != 'cloud'
        env:
          HAS_APP: ${{ (inputs.profile != '' && secrets.DESKTOP_RELEASES_APP_ID != '' && secrets.DESKTOP_RELEASES_APP_PRIVATE_KEY != '') || (inputs.profile == '' && secrets.RELEASES_APP_ID != '' && secrets.RELEASES_APP_PRIVATE_KEY != '') }}
        run: |
          set -euo pipefail
          owner="${RELEASES_REPOSITORY%%/*}"
          name="${RELEASES_REPOSITORY#*/}"
          # A profile's repository is masked; so are its parts.
          if [ -n "$PROFILE" ]; then
            echo "::add-mask::$owner"
            echo "::add-mask::$name"
          fi
          {
            echo "RELEASES_OWNER=$owner"
            echo "RELEASES_NAME=$name"
          } >> "$GITHUB_ENV"
          echo "has_app=$HAS_APP" >> "$GITHUB_OUTPUT"

      # Preparation (prepare-only and the automatic workflow_run) builds a
      # candidate and never publishes, so it neither mints this token nor
      # checks publishing access; Desktop Promote does both before it publishes.
      - name: Mint a releases repository token
        id: releases-token
        if: ${{ steps.releases-app.outputs.has_app == 'true' && github.event_name != 'workflow_run' && !inputs.prepare-only }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ (inputs.profile != '' && secrets.DESKTOP_RELEASES_APP_ID) || (inputs.profile == '' && secrets.RELEASES_APP_ID) || '' }}
          private-key: ${{ (inputs.profile != '' && secrets.DESKTOP_RELEASES_APP_PRIVATE_KEY) || (inputs.profile == '' && secrets.RELEASES_APP_PRIVATE_KEY) || '' }}
          owner: ${{ env.RELEASES_OWNER }}
          repositories: ${{ env.RELEASES_NAME }}
          permission-contents: write

      - name: Check publishing access
        if: ${{ github.event_name != 'workflow_run' && !inputs.prepare-only && env.RELEASE_FEED != 'cloud' }}
        env:
          GH_TOKEN: ${{ steps.releases-token.outputs.token || secrets.RELEASES_TOKEN }}
          APP_TOKEN: ${{ steps.releases-token.outputs.token != '' }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            if [ -n "$PROFILE" ]; then pair="DESKTOP_RELEASES_APP_ID + DESKTOP_RELEASES_APP_PRIVATE_KEY"; else pair="RELEASES_APP_ID + RELEASES_APP_PRIVATE_KEY"; fi
            echo "::error::Set $pair (a GitHub App installed on the releases repository with Contents: read and write) or RELEASES_TOKEN. The source repo's GITHUB_TOKEN cannot publish there."
            exit 1
          fi
          # An installation token's repository response may carry no
          # permissions; minting it with Contents write already proved access.
          gh api "repos/$RELEASES_REPOSITORY" > repository.json
          jq -e --argjson app "$APP_TOKEN" '.private == false and ($app or .permissions.push == true)' repository.json > /dev/null || {
            echo "::error::The releases repo must be public and the releases App or RELEASES_TOKEN must have write access."
            exit 1
          }
          gh api "repos/$RELEASES_REPOSITORY/commits/main" --jq .sha > /dev/null || {
            echo "::error::Initialize the releases repo with its README before publishing."
            exit 1
          }

      - name: Download the disk images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dmg-*
          path: downloads
          merge-multiple: true

      - name: Download the Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: linux-downloads
          merge-multiple: true

      - name: Download the Windows packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-*
          path: windows-downloads
          merge-multiple: true

      - name: Stage the release assets
        id: stage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Keep distributable packages separate from the checkout's branding assets/.
          # Every name starts with the profile's prefix (ASSET_PREFIX):
          # AgentRelay for the default profile, Desktop-<id> for another.
          mkdir release-assets
          for arch in arm64 x64; do
            # The pinned names carry the minimum macOS from Package.swift; the
            # stable name agentrelay.com links to gets identical bytes.
            python3 scripts/macos-release-assets.py "$VERSION" "$arch" \
              "downloads/$ASSET_PREFIX-$VERSION-macOS-$arch.dmg" release-assets --asset-prefix "$ASSET_PREFIX"

            probe_versioned="$ASSET_PREFIX-$VERSION-macOS-$arch-probe.tar.gz"
            probe_stable="$ASSET_PREFIX-macOS-$arch-probe.tar.gz"
            test -f "downloads/$probe_versioned" || { echo "::error::missing $probe_versioned"; exit 1; }
            cp "downloads/$probe_versioned" "release-assets/$probe_versioned"
            cp "downloads/$probe_versioned" "release-assets/$probe_stable"

            linux_tar="$ASSET_PREFIX-$VERSION-Linux-$arch.tar.gz"
            linux_deb="$ASSET_PREFIX-$VERSION-Linux-$arch.deb"
            test -f "linux-downloads/$linux_tar" || { echo "::error::missing $linux_tar"; exit 1; }
            test -f "linux-downloads/$linux_deb" || { echo "::error::missing $linux_deb"; exit 1; }
            cp "linux-downloads/$linux_tar" "release-assets/$linux_tar"
            cp "linux-downloads/$linux_deb" "release-assets/$linux_deb"
            cp "linux-downloads/$linux_tar" "release-assets/$ASSET_PREFIX-Linux-$arch.tar.gz"
            cp "linux-downloads/$linux_deb" "release-assets/$ASSET_PREFIX-Linux-$arch.deb"

            linux_probe="$ASSET_PREFIX-$VERSION-Linux-$arch-probe.tar.gz"
            test -f "linux-downloads/$linux_probe" || { echo "::error::missing $linux_probe"; exit 1; }
            cp "linux-downloads/$linux_probe" "release-assets/$linux_probe"
            cp "linux-downloads/$linux_probe" "release-assets/$ASSET_PREFIX-Linux-$arch-probe.tar.gz"

            windows_zip="$ASSET_PREFIX-$VERSION-Windows-$arch.zip"
            windows_probe="$ASSET_PREFIX-$VERSION-Windows-$arch-probe.zip"
            windows_setup="$ASSET_PREFIX-$VERSION-Windows-$arch-Setup.exe"
            test -f "windows-downloads/$windows_zip" || { echo "::error::missing $windows_zip"; exit 1; }
            test -f "windows-downloads/$windows_probe" || { echo "::error::missing $windows_probe"; exit 1; }
            test -f "windows-downloads/$windows_setup" || { echo "::error::missing $windows_setup"; exit 1; }
            cp "windows-downloads/$windows_zip" "release-assets/$windows_zip"
            cp "windows-downloads/$windows_zip" "release-assets/$ASSET_PREFIX-Windows-$arch.zip"
            cp "windows-downloads/$windows_probe" "release-assets/$windows_probe"
            cp "windows-downloads/$windows_probe" "release-assets/$ASSET_PREFIX-Windows-$arch-probe.zip"
            cp "windows-downloads/$windows_setup" "release-assets/$windows_setup"
            cp "windows-downloads/$windows_setup" "release-assets/$ASSET_PREFIX-Windows-$arch-Setup.exe"
          done
          # The headless installers are served from the public releases repo
          # (a cloud profile: from its own feed) so their one-line installs
          # keep working wherever the source lives. Every product installs
          # into the same prefix and user unit (one Agent Relay app per
          # machine), so a profile release publishes all three (install.sh
          # for Linux, install-macos.sh for macOS, install.ps1 for Windows),
          # set to install the profile's own releases: its product name,
          # releases repository, asset prefix, feed (github or cloud), site,
          # profile id and feed public key replace the default's seven
          # assignments in each (docs/workspace-layout.md, "Site profiles").
          # install-macos.sh reads releases repositories only and refuses a
          # cloud feed, which carries no macOS core bundle. A github: profile
          # needs its releases repository and a cloud profile its site, id
          # and key; with neither a repository nor a site there is nothing
          # to install from, and the step fails. Nothing is logged but the
          # opaque id.
          if [ -z "$PROFILE" ]; then
            cp linux/install.sh release-assets/install.sh
            cp macos/install.sh release-assets/install-macos.sh
            cp windows/install.ps1 release-assets/install.ps1
          else
            python3 - linux/install.sh macos/install.sh windows/install.ps1 release-assets <<'PY'
          import os, re, shlex, sys
          shell, mac_shell, powershell, target = sys.argv[1:]
          env = {name: os.environ.get(name, "") for name in (
              "PROFILE", "PRODUCT_NAME", "RELEASES_REPOSITORY", "ASSET_PREFIX",
              "RELEASE_FEED", "SITE_URL", "FEED_PUBLIC_KEY")}
          if env["RELEASE_FEED"] == "cloud":
              feed = "cloud"
              if not (env["SITE_URL"] and env["FEED_PUBLIC_KEY"]):
                  sys.exit("a cloud profile's installers need its site and feed public key")
              if not re.fullmatch(r"[a-z0-9]{1,32}", env["PROFILE"]):
                  sys.exit("a cloud profile's id must be 1 to 32 lowercase letters and digits (the feed's key_id)")
              if env["RELEASES_REPOSITORY"]:
                  sys.exit("a cloud profile has no releases repository")
          elif env["RELEASE_FEED"] == "github:" or env["RELEASE_FEED"].startswith("github:"):
              feed = "github"
              if not env["RELEASES_REPOSITORY"]:
                  sys.exit("a github: profile's installers need its releases repository")
          else:
              sys.exit("RELEASE_FEED must be github:<owner>/<name> or cloud")
          values = {
              "PRODUCT_NAME": env["PRODUCT_NAME"], "RELEASES_REPOSITORY": env["RELEASES_REPOSITORY"],
              "ASSET_PREFIX": env["ASSET_PREFIX"], "RELEASE_FEED": feed, "SITE_URL": env["SITE_URL"],
              "PROFILE_ID": env["PROFILE"], "FEED_PUBLIC_KEY": env["FEED_PUBLIC_KEY"],
          }
          if not values["PRODUCT_NAME"] or not values["ASSET_PREFIX"]:
              sys.exit("a profile's installers need its product name and asset prefix")
          if any(ord(c) < 32 or ord(c) == 127 for value in values.values() for c in value):
              sys.exit("a profile value holds a control character")
          def powershell_string(value):
              # ASCII stays in single-quoted literals, each ' doubled; any
              # other character (the typographic quotes PowerShell also ends
              # a literal at included) is a [char] code, so the script stays
              # ASCII and reads the same under Windows PowerShell's ANSI
              # default.
              parts, run = [], ""
              for char in value:
                  if ord(char) < 128:
                      run += "''" if char == "'" else char
                      continue
                  if run:
                      parts.append(f"'{run}'")
                      run = ""
                  units = char.encode("utf-16-be")
                  parts.extend(f"[string][char]0x{units[i:i + 2].hex().upper()}" for i in range(0, len(units), 2))
              if run or not parts:
                  parts.append(f"'{run}'")
              if not parts[0].startswith("'"):
                  parts.insert(0, "''")
              return " + ".join(parts)
          PS_NAMES = {
              "PRODUCT_NAME": "ProductName", "RELEASES_REPOSITORY": "ReleasesRepository",
              "ASSET_PREFIX": "AssetPrefix", "RELEASE_FEED": "ReleaseFeed", "SITE_URL": "SiteUrl",
              "PROFILE_ID": "ProfileId", "FEED_PUBLIC_KEY": "FeedPublicKey",
          }
          for source, name, assign in (
              (shell, "install.sh", lambda key, value: (rf"^{key}=.*$", f"{key}={shlex.quote(value)}")),
              (mac_shell, "install-macos.sh", lambda key, value: (rf"^{key}=.*$", f"{key}={shlex.quote(value)}")),
              (powershell, "install.ps1", lambda key, value: (
                  rf"^\${PS_NAMES[key]} = .*$", f"${PS_NAMES[key]} = {powershell_string(value)}")),
          ):
              with open(source, encoding="utf-8", newline="") as file:
                  text = file.read()
              for key, value in values.items():
                  pattern, line = assign(key, value)
                  text, count = re.subn(pattern, lambda _: line, text, flags=re.M)
                  if count != 1:
                      sys.exit(f"{source} must assign {key} exactly once")
              with open(os.path.join(target, name), "w", encoding="utf-8", newline="") as file:
                  file.write(text)
          PY
            echo "Profile $PROFILE: install.sh, install-macos.sh and install.ps1 for the profile's releases."
          fi
          ( cd release-assets && for script in install.sh install-macos.sh install.ps1; do sha256sum "$script" > "$script.sha256"; done )
          ( cd release-assets && for package in *.dmg *.tar.gz *.deb *.zip *.exe; do sha256sum "$package" > "$package.sha256"; done )

          probe_version=""
          for record in \
            downloads/probe-version-arm64.txt \
            downloads/probe-version-x64.txt \
            linux-downloads/probe-version-linux-arm64.txt \
            linux-downloads/probe-version-linux-x64.txt \
            windows-downloads/probe-version-windows-arm64.txt \
            windows-downloads/probe-version-windows-x64.txt; do
            test -f "$record" || { echo "::error::missing $record"; exit 1; }
            recorded="$(tr -d '\n\r' < "$record")"
            test "$recorded" = "$VERSION" || { echo "::error::wrong probe version in $record: expected $VERSION, got $recorded"; exit 1; }
            if [ -z "$probe_version" ]; then
              probe_version="$recorded"
            elif [ "$recorded" != "$probe_version" ]; then
              echo "::error::probe version mismatch: $record contains $recorded, expected $probe_version"
              exit 1
            fi
          done
          echo "probe_version=$probe_version" >> "$GITHUB_OUTPUT"

          ls -l release-assets

      # A profile's notes name it by its id and never a product, and come
      # from the Unreleased section (its version numbers are its own).
      - name: Prepare release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PROBE_VERSION: ${{ steps.stage.outputs.probe_version }}
        run: |
          args=()
          if [ -n "$PROFILE" ]; then args+=(--unreleased); fi
          if [ "${RELEASE_FEED:-}" = cloud ]; then args+=(--feed cloud); fi
          python3 scripts/release-notes.py "$VERSION" \
            --repository "$RELEASES_REPOSITORY" \
            --asset-prefix "$ASSET_PREFIX" \
            --probe-version "$PROBE_VERSION" \
            --output release-notes.md ${args[@]+"${args[@]}"}

      # A cloud release publishes from a verified candidate too: the
      # candidate records "feed": "cloud", and its recorded bytes are the
      # ones the feed is asked to declare and receives.
      - name: Prepare verified release candidate
        if: github.event_name == 'workflow_run' || inputs.prepare-only || env.RELEASE_FEED == 'cloud'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          SOURCE_SHA: ${{ needs.version.outputs.source-sha }}
          CI_RUN_ID: ${{ inputs.ci-run-id || github.event.workflow_run.id }}
          UNLISTED: ${{ needs.version.outputs.unlisted }}
          CRATES: ${{ needs.version.outputs.crates }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          cp -R release-assets candidate/assets
          cp release-notes.md candidate/release-notes.md
          args=(create --directory candidate --source-sha "$SOURCE_SHA" \
            --version "$VERSION" --channel "$CHANNEL" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --tests-passed --profile "$PROFILE")
          if [ -n "$CI_RUN_ID" ]; then args+=(--ci-run-id "$CI_RUN_ID"); fi
          if [ "${RELEASE_FEED:-}" = cloud ]; then args+=(--feed cloud); fi
          if [ "${UNLISTED:-}" = true ]; then args+=(--unlisted); fi
          if [ -n "${CRATES:-}" ]; then
            crates="$(mktemp)"
            printf '%s\n' "$CRATES" > "$crates"
            args+=(--crates "$crates")
          fi
          python3 scripts/release-candidate.py "${args[@]}"

      - name: Upload verified release candidate
        if: github.event_name == 'workflow_run' || inputs.prepare-only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # A cloud feed: declare the candidate's versioned packages,
      # install.sh and install.ps1 (never the unversioned aliases, install-macos.sh or .sha256 files: the feed
      # binds names to <asset_prefix>-<version>- and records each sha256),
      # upload each, then publish. Stable is published as latest; beta is
      # not. A failed upload or publish leaves the feed's draft unpublished
      # and this job red; a rerun resumes the same draft. The bridge follows
      # the proposed Cloud contract (relay-control docs/desktop-feed.md), and
      # the token reaches this step's environment only.
      - name: Publish to the cloud feed
        if: ${{ env.RELEASE_FEED == 'cloud' && github.event_name != 'workflow_run' && !inputs.prepare-only }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          SOURCE_SHA: ${{ needs.version.outputs.source-sha }}
          DESKTOP_FEED_PUBLISHER_TOKEN: ${{ secrets.DESKTOP_FEED_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release-candidate.py cloud-assets --directory candidate --feed cloud \
            --source-sha "$SOURCE_SHA" --version "$VERSION" --channel "$CHANNEL" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --profile "$PROFILE" \
            --output cloud-assets.txt
          python3 scripts/desktop-feed-publish.py publish --site "$SITE_URL" --profile "$PROFILE" \
            --feed "$RELEASE_FEED" --asset-prefix "$ASSET_PREFIX" --version "$VERSION" \
            --channel "$CHANNEL" --notes candidate/release-notes.md --directory candidate/assets \
            --assets cloud-assets.txt

      - name: Create the release
        if: ${{ github.event_name != 'workflow_run' && !inputs.prepare-only && env.RELEASE_FEED != 'cloud' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The profile's repository, and the App token minted for it (or
          # RELEASES_TOKEN), from its environment.
          repository: ${{ env.RELEASES_REPOSITORY }}
          token: ${{ steps.releases-token.outputs.token || secrets.RELEASES_TOKEN }}
          # Tags belong to the distribution repo, never the source SHA.
          target_commitish: main
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.title }}
          draft: false
          prerelease: ${{ needs.version.outputs.channel == 'beta' }}
          make_latest: ${{ needs.version.outputs.channel == 'stable' }}
          # Generated notes would describe the distribution repo, not the app.
          generate_release_notes: false
          fail_on_unmatched_files: true
          # The prefix comes from this job's own site-profile step (env), never
          # from a job output: a job output that contains a masked value (a
          # profile id equal to its link scheme, say) is dropped by the runner.
          files: |
            release-assets/install.sh
            release-assets/install.sh.sha256
            release-assets/install-macos.sh
            release-assets/install-macos.sh.sha256
            release-assets/install.ps1
            release-assets/install.ps1.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-macOS*-arm64.dmg
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-macOS*-arm64.dmg.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-macOS*-x64.dmg
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-macOS*-x64.dmg.sha256
            release-assets/${{ env.ASSET_PREFIX }}-macOS-arm64.dmg
            release-assets/${{ env.ASSET_PREFIX }}-macOS-arm64.dmg.sha256
            release-assets/${{ env.ASSET_PREFIX }}-macOS-x64.dmg
            release-assets/${{ env.ASSET_PREFIX }}-macOS-x64.dmg.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-macOS-arm64-probe.tar.gz
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-macOS-arm64-probe.tar.gz.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-macOS-x64-probe.tar.gz
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-macOS-x64-probe.tar.gz.sha256
            release-assets/${{ env.ASSET_PREFIX }}-macOS-arm64-probe.tar.gz
            release-assets/${{ env.ASSET_PREFIX }}-macOS-arm64-probe.tar.gz.sha256
            release-assets/${{ env.ASSET_PREFIX }}-macOS-x64-probe.tar.gz
            release-assets/${{ env.ASSET_PREFIX }}-macOS-x64-probe.tar.gz.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Linux-arm64.tar.gz
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Linux-arm64.tar.gz.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Linux-arm64.deb
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Linux-arm64.deb.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Linux-x64.tar.gz
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Linux-x64.tar.gz.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Linux-x64.deb
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Linux-x64.deb.sha256
            release-assets/${{ env.ASSET_PREFIX }}-Linux-arm64.tar.gz
            release-assets/${{ env.ASSET_PREFIX }}-Linux-arm64.tar.gz.sha256
            release-assets/${{ env.ASSET_PREFIX }}-Linux-arm64.deb
            release-assets/${{ env.ASSET_PREFIX }}-Linux-arm64.deb.sha256
            release-assets/${{ env.ASSET_PREFIX }}-Linux-x64.tar.gz
            release-assets/${{ env.ASSET_PREFIX }}-Linux-x64.tar.gz.sha256
            release-assets/${{ env.ASSET_PREFIX }}-Linux-x64.deb
            release-assets/${{ env.ASSET_PREFIX }}-Linux-x64.deb.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Linux-arm64-probe.tar.gz
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Linux-arm64-probe.tar.gz.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Linux-x64-probe.tar.gz
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Linux-x64-probe.tar.gz.sha256
            release-assets/${{ env.ASSET_PREFIX }}-Linux-arm64-probe.tar.gz
            release-assets/${{ env.ASSET_PREFIX }}-Linux-arm64-probe.tar.gz.sha256
            release-assets/${{ env.ASSET_PREFIX }}-Linux-x64-probe.tar.gz
            release-assets/${{ env.ASSET_PREFIX }}-Linux-x64-probe.tar.gz.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-arm64.zip
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-arm64.zip.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-x64.zip
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-x64.zip.sha256
            release-assets/${{ env.ASSET_PREFIX }}-Windows-arm64.zip
            release-assets/${{ env.ASSET_PREFIX }}-Windows-arm64.zip.sha256
            release-assets/${{ env.ASSET_PREFIX }}-Windows-x64.zip
            release-assets/${{ env.ASSET_PREFIX }}-Windows-x64.zip.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-arm64-probe.zip
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-arm64-probe.zip.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-x64-probe.zip
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-x64-probe.zip.sha256
            release-assets/${{ env.ASSET_PREFIX }}-Windows-arm64-probe.zip
            release-assets/${{ env.ASSET_PREFIX }}-Windows-arm64-probe.zip.sha256
            release-assets/${{ env.ASSET_PREFIX }}-Windows-x64-probe.zip
            release-assets/${{ env.ASSET_PREFIX }}-Windows-x64-probe.zip.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-arm64-Setup.exe
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-arm64-Setup.exe.sha256
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-x64-Setup.exe
            release-assets/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-x64-Setup.exe.sha256
            release-assets/${{ env.ASSET_PREFIX }}-Windows-arm64-Setup.exe
            release-assets/${{ env.ASSET_PREFIX }}-Windows-arm64-Setup.exe.sha256
            release-assets/${{ env.ASSET_PREFIX }}-Windows-x64-Setup.exe
            release-assets/${{ env.ASSET_PREFIX }}-Windows-x64-Setup.exe.sha256
          body_path: release-notes.md

  changelog:
    # always(): a skipped full matrix upstream must not skip this job. The
    # changelog is the default profile's: a profile's versions are its own.
    if: always() && !cancelled() && needs.version.outputs.skip != 'true' && github.event_name != 'workflow_run' && !inputs.prepare-only && !inputs.profile && needs.publish.result == 'success' && needs.version.outputs.channel == 'stable'
    name: Prepare promoted changelog
    needs:
      - version
      - publish
    runs-on: ${{ vars.DEPLOY_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Check out the released snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source-sha }}
          persist-credentials: false

      - name: Promote Unreleased in the artifact
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/release-notes.py "$VERSION" --promote

      - name: Upload the promoted changelog
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promoted-changelog-v${{ needs.version.outputs.version }}
          path: CHANGELOG.md
          if-no-files-found: error
          retention-days: 30
