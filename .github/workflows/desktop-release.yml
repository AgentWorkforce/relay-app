  package-windows-x64:
    name: Build Windows x64
    needs: [version, compile-windows-x64]
    if: needs.version.outputs.skip != 'true'
    # The GTK app and the core, built natively with MSYS2's clang toolchain
    # and GTK 4; the zip carries the GTK runtime beside them.
    runs-on: ${{ vars.CI_WINDOWS_RUNNER || 'windows-latest' }}
    # Always under an environment, so a signing identity can trust exactly
    # this job (docs/windows-app.md, "Code signing"): the profile's, else
    # desktop-release.
    environment: ${{ inputs.profile && format('desktop-{0}', inputs.profile) || 'desktop-release' }}
    permissions:
      contents: read
      # Azure Trusted Signing sign-in (OIDC); no other job has it.
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep line endings and allow long paths
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source-sha }}
          persist-credentials: false

      - name: Resolve the site profile
        uses: ./.github/actions/site-profile
        with:
          profile: ${{ inputs.profile }}
          site-url: ${{ secrets.AGENT_RELAY_SITE_URL }}
          url-scheme: ${{ secrets.AGENT_RELAY_URL_SCHEME }}
          product-name: ${{ secrets.DESKTOP_PRODUCT_NAME }}
          bundle-id: ${{ secrets.DESKTOP_BUNDLE_ID }}
          coexist: ${{ vars.DESKTOP_COEXIST }}
          releases-repository: ${{ secrets.RELEASES_REPOSITORY }}
          release-feed: ${{ secrets.RELEASE_FEED }}
          feed-public-key: ${{ secrets.DESKTOP_FEED_PUBLIC_KEY }}
          feed-publisher-token-set: ${{ secrets.DESKTOP_FEED_PUBLISHER_TOKEN != '' }}
          support-url: ${{ secrets.DESKTOP_SUPPORT_URL }}
          policy-defaults: ${{ secrets.DESKTOP_POLICY_DEFAULTS }}
          history-upload-storage-origins: ${{ secrets.DESKTOP_HISTORY_UPLOAD_STORAGE_ORIGINS }}

      - name: Download the compiled core
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-windows-x64-core
          path: compiled/core

      - name: Download the compiled app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-windows-x64-app
          path: compiled/app

      # The Setup .exe is compiled with Inno Setup 6, as in desktop-ci.yml.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install innosetup --no-progress -y
            } else {
              winget install --id JRSoftware.InnoSetup -e --scope machine --silent --accept-source-agreements --accept-package-agreements --disable-interactivity
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-Item $iscc | Format-List FullName, VersionInfo

      # Sign only when all six signing variables are set; otherwise build
      # unsigned with a warning. Prints no value but the endpoint's host.
      - name: Resolve Windows signing
        id: signing
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_CERT_PROFILE: ${{ vars.TRUSTED_SIGNING_CERT_PROFILE }}
          # The ref whose source is built: an automatic candidate builds the
          # Desktop CI run's branch (the version job admits only main pushes
          # from this repository), any other run builds github.ref.
          SIGNING_REF: ${{ github.event_name != 'workflow_run' && github.ref || (github.event.workflow_run.head_repository.full_name == github.repository && format('refs/heads/{0}', github.event.workflow_run.head_branch)) || 'a fork' }}
        run: |
          # Only main, hotfix/ branches and desktop-v tags are signed: a
          # dispatch from any other branch builds unsigned. The desktop-release and desktop-<id>
          # environments' deployment rules are the second layer
          # (docs/windows-app.md, "Code signing").
          $ref = $env:SIGNING_REF
          if ($ref -cne 'refs/heads/main' -and -not $ref.StartsWith('refs/tags/desktop-v', [StringComparison]::Ordinal) -and -not $ref.StartsWith('refs/heads/hotfix/', [StringComparison]::Ordinal)) {
            $message = "Building unsigned: only main, hotfix/ branches and desktop-v tags are signed, and this run builds $ref."
            Write-Output "::warning title=Windows signing skipped::$message"
            Write-Output "Windows signing skipped. $message"
            'sign=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $names = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_SUBSCRIPTION_ID',
            'TRUSTED_SIGNING_ENDPOINT', 'TRUSTED_SIGNING_ACCOUNT', 'TRUSTED_SIGNING_CERT_PROFILE'
          $missing = @($names | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing) {
            $message = "Building unsigned: the repository variables $($missing -join ', ') are not set."
            Write-Output "::warning title=Windows signing skipped::$message"
            Write-Output "Windows signing skipped. $message"
            'sign=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $endpoint = $null
          if (-not [Uri]::TryCreate($env:TRUSTED_SIGNING_ENDPOINT, 'Absolute', [ref]$endpoint) -or $endpoint.Scheme -ne 'https') {
            throw 'TRUSTED_SIGNING_ENDPOINT is not an https URL'
          }
          Write-Output "Signing with Azure Trusted Signing at $($endpoint.Host)."
          'sign=true' >> $env:GITHUB_OUTPUT

      - name: Sign in for Windows signing
        id: sign-in
        if: steps.signing.outputs.sign == 'true'
        uses: ./.github/actions/windows-sign
        with:
          mode: setup
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          account: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile: ${{ vars.TRUSTED_SIGNING_CERT_PROFILE }}

      # When signing, every PE file is signed before it is zipped, and Inno
      # signs Setup and its uninstaller.
      - name: Assemble the captured runtimes and build packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGN_COMMAND: ${{ steps.sign-in.outputs.sign-command }}
        run: |
          $signing = if ($env:SIGN_COMMAND) { @('--sign-command', $env:SIGN_COMMAND) } else { @() }
          python scripts/package-windows.py --version "$env:VERSION" --arch 'x64' `
            --app-runtime compiled/app --core-runtime compiled/core --out out --installer `
            --source-sha '${{ needs.version.outputs.source-sha }}' @signing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content -Encoding ascii -Path 'out/probe-version-windows-x64.txt' -Value $env:VERSION

      # Every PE file in both zips, and Setup, must carry a valid signature.
      - name: Verify Windows signatures
        id: verify-signatures
        uses: ./.github/actions/windows-sign
        with:
          mode: verify
          sign: ${{ steps.signing.outputs.sign }}
          archives: |
            out/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-x64.zip
            out/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-x64-probe.zip
          files: out/${{ env.ASSET_PREFIX }}-${{ needs.version.outputs.version }}-Windows-x64-Setup.exe

      # Use only the DLLs shipped with the package, rather than a build host's PATH.
      - name: Smoke test the packaged core
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked'
          Expand-Archive -LiteralPath "out/$env:ASSET_PREFIX-$env:VERSION-Windows-x64.zip" -DestinationPath $unpacked -Force
          $env:PATH = "$env:SystemRoot\System32"
          & "$unpacked/AgentRelay-Windows-x64/bin/agent-relay-probe.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Setup installs per user where the updater expects the tree, and its
      # uninstaller removes the install, the shortcut and the entry. A signed
      # build's installed uninstaller must carry a valid signature.
      - name: Install and uninstall with Setup
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGN: ${{ steps.signing.outputs.sign }}
          SIGNTOOL: ${{ steps.verify-signatures.outputs.signtool }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          $setup = "out\$env:ASSET_PREFIX-$version-Windows-x64-Setup.exe"
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $root = "$env:LOCALAPPDATA\Programs\AgentRelay"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Agent Relay.lnk"
          $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{C5377993-AE99-466F-A519-676A299A6C6D}_is1'
          foreach ($path in "$root\$version\AgentRelay-Windows-x64\bin\agent-relay.exe", "$root\unins000.exe", $shortcut, $entry) {
            if (-not (Test-Path $path)) { throw "Setup did not create $path" }
          }
          Get-ItemProperty $entry | Format-List DisplayName, DisplayVersion, InstallLocation
          if ($env:SIGN -eq 'true') {
            & $env:SIGNTOOL verify /pa /v "$root\unins000.exe" "$root\$version\AgentRelay-Windows-x64\bin\agent-relay.exe"
            if ($LASTEXITCODE -ne 0) { throw "The installed uninstaller or app is not validly signed ($LASTEXITCODE)" }
          }
          Start-Process "$root\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller finishes removing its own folder just after it exits.
          for ($i = 0; $i -lt 30 -and (Test-Path $root); $i++) { Start-Sleep -Seconds 1 }
          foreach ($path in $root, $shortcut, $entry, "HKCU:\Software\Classes\$env:URL_SCHEME") {
            if (Test-Path $path) { throw "The uninstaller left $path" }
          }

      - name: Remove the unpacked staging tree
        run: Remove-Item -Recurse -Force 'out/AgentRelay-Windows-x64'

      - name: Upload the Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: out/
          if-no-files-found: error
          retention-days: 7

