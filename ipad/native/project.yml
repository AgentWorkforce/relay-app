name: AgentRelayiPad
options:
  bundleIdPrefix: com.agentworkforce
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: QUJ7SA6X8X
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
  RelaySessionOverview:
    path: ../../shared/RelaySessionOverview
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 156.0.0
targets:
  AgentRelayiPad:
    type: application
    platform: iOS
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Agent Relay
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "54"
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Agent Relay uses the camera to share video during calls with your agents.
        NSMicrophoneUsageDescription: Agent Relay uses the microphone during voice calls with your agents. With GPT-Live voice, call audio is sent to OpenAI.
        NSSpeechRecognitionUsageDescription: Agent Relay turns what you say in a voice call into text on this device and sends that text to the agent.
        RelayVoiceCallEnabled: $(RELAY_VOICE_CALL_ENABLED)
        RelaySummarySearchEnabled: $(RELAY_SUMMARY_SEARCH_ENABLED)
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ThirdPartyNotices.txt
        buildPhase: resources
    postBuildScripts:
      - name: Voice calls keep running in the background
        basedOnDependencyAnalysis: false
        script: |
          # Voice calls are on in every build (RelayVoiceCallEnabled), so every
          # build declares background audio to keep calls running.
          if [ "$RELAY_VOICE_CALL_ENABLED" = "YES" ]; then
            plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$plist" | grep -q "^ *audio$"; then
              /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes: string audio" "$plist"
            fi
          fi
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: RelaySessionOverview
        product: RelaySessionOverview
      - package: WebRTC
        product: WebRTC
    scheme:
      testTargets:
        - AgentRelayUnitTests
        - AgentRelayUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentworkforce.relayipad
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "54"
        CODE_SIGN_ENTITLEMENTS: Sources/AgentRelayiPad.entitlements
        # The Debug background-audio script edits the built Info.plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_CFBundleDisplayName: Agent Relay
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      configs:
        Debug:
          APS_ENVIRONMENT: development
          RELAY_VOICE_CALL_ENABLED: "YES"
          RELAY_SUMMARY_SEARCH_ENABLED: "YES"
        Release:
          APS_ENVIRONMENT: production
          RELAY_VOICE_CALL_ENABLED: "YES"
          RELAY_SUMMARY_SEARCH_ENABLED: "NO"
  AgentRelayUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
    dependencies:
      - target: AgentRelayiPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentworkforce.relayipad.unittests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AgentRelayiPad.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AgentRelayiPad
        BUNDLE_LOADER: $(TEST_HOST)
  AgentRelayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AgentRelayiPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentworkforce.relayipad.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
