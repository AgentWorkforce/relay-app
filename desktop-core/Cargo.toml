[package]
name = "agent-relay-desktop-core"
version = "0.0.0"
publish = false
edition = "2021"
license = "FSL-1.1-ALv2"

[[bin]]
name = "agent-relay-desktop-probe"
path = "src/bin/agent-relay-desktop-probe.rs"

[[bin]]
name = "agent-relay-desktop-contract"
path = "src/bin/agent-relay-desktop-contract.rs"

[workspace]

[features]
# `Account::with_site`: a test points an account at its fake Cloud. On only
# in this crate's own tests, examples and benches, through the
# dev-dependency on itself below; a shipped core has no run-time site.
test-site = []
# PREVIEW ONLY (docs/service-callers.md): every same-uid local peer is
# taken for the attested app, so a service caller can be proven end to end
# before real attestation exists. Off by default, no run-time switch, a
# compile error outside the debug profile, and never in a release or a
# landing diff (scripts/test-dev-attest-guard.sh).
service-callers-dev-attest = []

[dependencies]
# Relay's public core (AgentWorkforce/relay crates/relay-node), pinned to the
# commit a core release was cut from. Move it in desktop-core and gtk together.
agent-relay-node = { git = "https://github.com/AgentWorkforce/relay", rev = "d783c7d89adc0f6781cd82db50e3a42f41ebcdd8", default-features = false }
# relayhistory 0.59.0 from crates.io. `history-provider-sources` pins ai-hist
# exactly (its helper surface carries ai-hist types), so ai-hist is pinned to
# the same exact version here to build a single ai-hist.
ai-hist = { version = "=0.59.0", features = ["opencode-backup", "git-hooks", "fs-events"] }
# The remote source connectors session history composes (`devin-cloud`,
# `cursor-cloud`).
history-provider-sources = "=0.59.0"
# The watcher ai-hist's own watch is built on, for selected mode's catalog
# (src/probe/inventory.rs), which ai-hist's sync-driven watch cannot serve.
notify = "8"
# Safe PTY ownership and shutdown signals for native Muse spawning.
portable-pty = "=0.8.1"
anyhow = "1"
base64 = "0.22"
# The cloud release feed's Ed25519 manifest signature (src/feed), shared by
# the GTK updater and `agent-relay-probe feed verify`.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
clap = { version = "4", features = ["derive", "env"] }
atomicwrites = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1.1"
fs2 = "0.4"
futures-util = "0.3"
getrandom = "0.2"
hostname = "0.4"
libc = "0.2"
# Gravatar addresses avatars by the MD5 of an email; nothing else uses it.
md-5 = "0.10"
same-file = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled", "functions"] }
relaycast = "10.0.0"
# The session-body scrub engine behind history::scrub. An exact version:
# move it in desktop-core and gtk together (scripts/apply-crate-overrides.sh).
relayscrubber = "=0.5.0-alpha.9"
ryu-js = "1.0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
# Release tarballs the Linux app's updater unpacks (gtk/src/updates.rs).
tar = "0.4"
tempfile = "3"
toml_edit = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
# The version and TLS stack the relaycast SDK already links, for the node
# socket it does not expose (see src/relay/sdk_gaps.rs).
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# The TLS configuration every WebSocket connect shares, with the platform's
# roots read once (src/relay/websocket_tls.rs); the versions and features
# tokio-tungstenite already links.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
# The local OpenClaw Gateway (src/relay/openclaw.rs): a blocking WebSocket
# client on the version tokio-tungstenite already links, Ed25519 device
# signatures from the TLS stack's ring, and its JSON5 config file.
tungstenite = "0.24"
ring = "0.17"
json5 = "0.4"
unicode-normalization = "0.1"
ureq = { version = "2", features = ["json"] }
url = "2"
# Delivery request bodies, when the receiver publishes zstd (src/destination/encoding.rs).
zstd = { version = "0.13", default-features = false }
schemars = { version = "1", default-features = false, features = ["derive", "std"] }


[target.'cfg(unix)'.dependencies]
signal-hook = "=0.3.18"
nix = { version = "=0.25.1", default-features = false, features = ["signal", "process", "fs", "user"] }

# Codex is trusted on macOS only with OpenAI's code signature (see
# src/relay/process.rs), and the desktop mailbox credential lives in the
# login Keychain; these crates are already linked by the TLS stack.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3"
security-framework-sys = "2"
# Received attachments are quarantined (src/relay/files/store.rs); tar
# already links it.
xattr = "1"

# Windows platform code in the core: the registry and consoles.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_System_ProcessStatus", "Wdk_System_SystemInformation"] }

# The core's Windows platform shims (src/platform, src/relay/process/windows.rs,
# src/relay/login_item.rs): stopping processes and job objects; the process
# table's start times, executables, open files (the system handle table) and
# loopback listeners; and the launch-at-login Run key. sysinfo reads another
# process's command line, folder and environment from its PEB, which
# windows-sys alone would need hand-kept structure offsets for. The
# windows-sys features these need (Storage_FileSystem, IpHelper,
# ProcessStatus, Wdk SystemInformation) are on the entry above.
[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# End of the core's Windows platform shims.

[dev-dependencies]
# This crate's own tests build it with `test-site` (see [features]).
agent-relay-desktop-core = { path = ".", features = ["test-site"] }
# The contract document checks read the core's error schema.
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
rusqlite = { version = "0.32", features = ["hooks"] }
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
# build.rs checks DESKTOP_POLICY_DEFAULTS with the core's own policy rules
# (src/history/operator_policy/settings.rs).
serde_json = "1"
